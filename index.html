
<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduPanel v7.9 - Sistema de Evaluación</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    animation: { 
                        'bounce-slow': 'bounce 3s infinite',
                        'in-up': 'inUp 0.5s ease-out'
                    },
                    keyframes: {
                        inUp: {
                            '0%': { transform: 'translateY(10px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>

    <style type="text/css">
        body { transition: background-color 0.5s ease; overflow: hidden; height: 100vh; width: 100vw; }
        .dark body { background-color: #020617; color: #f8fafc; }
        body { background-color: #f8fafc; color: #0f172a; }
        
        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
        }
        .light .glass {
            background: rgba(15, 23, 42, 0.03);
            border: 1px solid rgba(15, 23, 42, 0.08);
        }

        .rosc_container { position: relative; width: 100%; max-width: 480px; aspect-ratio: 1/1; margin: auto; }
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        .card-back-pcb {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .card-back-pcb::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("https://www.transparenttextures.com/patterns/brushed-alum.png");
            opacity: 0.15;
            mix-blend-mode: overlay;
        }

        .hangman_slot {
            flex: 0 0 auto;
            width: clamp(20px, 6vw, 40px);
            aspect-ratio: 2/3;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 3px solid #6366f1;
            font-weight: 900;
            font-size: clamp(0.9rem, 3vw, 1.8rem);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        const ALPHABET = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split("");
        const MAX_MISTAKES_ROSCO = 5; 
        const MAX_MISTAKES_AHORCADO = 6; 
        
        // --- COMPONENTES ---

        const Rosco = ({ roscoItems, onBack }) => {
            const items = useMemo(() => {
                return ALPHABET.map(letter => {
                    const match = roscoItems.find(it => it.letter.toUpperCase() === letter);
                    if (match) {
                        const modeLabel = match.mode.toLowerCase().includes('empieza') ? 'EMPIEZA CON LA' : 'CONTIENE LA LETRA';
                        return { 
                            letter, 
                            word: match.word.toUpperCase(), 
                            definition: match.definition, 
                            titleLabel: `${modeLabel} ${letter}`,
                            disabled: false 
                        };
                    }
                    return { letter, word: "---", definition: "Sin datos", titleLabel: letter, disabled: true };
                });
            }, [roscoItems]);

            const [idx, setIdx] = useState(0);
            const [ans, setAns] = useState({});
            const [score, setScore] = useState(0);
            const [mistakes, setMistakes] = useState(0);
            const [input, setInput] = useState('');
            const [done, setDone] = useState(false);
            const [feedback, setFeedback] = useState(null); 
            const [locked, setLocked] = useState(false);
            const inputRef = useRef(null);

            const next = (currAnswers, currentMistakes) => {
                if (currentMistakes >= MAX_MISTAKES_ROSCO) {
                    setDone(true);
                    return;
                }
                let n = (idx + 1) % items.length;
                let count = 0;
                while ((currAnswers[n] || items[n].disabled) && count < items.length) {
                    n = (n + 1) % items.length;
                    count++;
                }
                if (count >= items.length) {
                    setDone(true);
                } else {
                    setIdx(n);
                    setInput('');
                    setTimeout(() => inputRef.current?.focus(), 50);
                }
            };

            useEffect(() => { if (items[idx]?.disabled && !done) next(ans, mistakes); }, [idx]);

            const check = () => {
                if (items[idx].disabled || locked) return;
                const isCorrect = input.trim().toUpperCase() === items[idx].word.toUpperCase();
                
                if (isCorrect) {
                    const newAns = { ...ans, [idx]: 'correct' };
                    setAns(newAns); 
                    setScore(s => s + 30); 
                    next(newAns, mistakes);
                } else {
                    const updatedMistakes = mistakes + 1;
                    setMistakes(updatedMistakes);
                    const newAns = { ...ans, [idx]: 'wrong' };
                    setAns(newAns);
                    setScore(s => Math.max(0, s - 5));
                    setFeedback(`Incorrecto. Era: ${items[idx].word}`);
                    setLocked(true);

                    setTimeout(() => {
                        setFeedback(null);
                        setLocked(false);
                        next(newAns, updatedMistakes);
                    }, 2000);
                }
            };

            if (done) return (
                <div className="max-w-md mx-auto text-center p-12 glass rounded-[3rem] shadow-2xl animate-in-up border-2 border-indigo-500/20">
                    <h2 className="text-4xl font-black mb-4 tracking-tighter text-slate-900 dark:text-white uppercase italic">Finalizado</h2>
                    <p className="text-sm font-black text-indigo-500 uppercase tracking-widest mb-6">
                        {mistakes >= MAX_MISTAKES_ROSCO ? "⚠️ Vidas Agotadas" : "🏁 Rosco Completado"}
                    </p>
                    <div className="grid grid-cols-1 gap-6 mb-8">
                        <div className="p-8 glass rounded-3xl border-b-8 border-indigo-500 bg-indigo-500/5">
                            <span className="block text-7xl font-black text-indigo-500 leading-none">{score}</span>
                            <span className="text-xs uppercase font-black opacity-40 tracking-widest text-slate-600 dark:text-indigo-200 mt-2 block">Puntos Finales</span>
                        </div>
                        <div className="p-8 glass rounded-3xl border-b-8 border-red-500 bg-red-500/5">
                            <span className="block text-7xl font-black text-red-500 leading-none">{mistakes}</span>
                            <span className="text-xs uppercase font-black opacity-40 tracking-widest text-slate-600 dark:text-red-200 mt-2 block">Errores</span>
                        </div>
                    </div>
                    <button onClick={onBack} className="w-full py-6 bg-indigo-600 text-white rounded-2xl font-black text-xl shadow-2xl hover:bg-indigo-500 transition-all">Regresar</button>
                </div>
            );

            return (
                <div className="max-w-6xl mx-auto h-[calc(100vh-140px)] flex flex-col px-4 animate-in-up">
                    <div className="flex justify-between items-center mb-4 shrink-0 px-2">
                        <div className="text-left">
                            <h2 className="text-xl md:text-2xl font-black tracking-tighter text-slate-900 dark:text-white uppercase italic leading-none">PASAPALABRA</h2>
                        </div>
                    </div>

                    <div className="flex-grow grid lg:grid-cols-2 gap-8 items-center overflow-hidden">
                        <div className="rosc_container scale-90 sm:scale-100">
                            <div className="absolute inset-0 flex flex-col items-center justify-center z-10 pointer-events-none text-center">
                                <div className="text-[48px] font-black text-indigo-600 dark:text-white leading-none tracking-tighter">{score}</div>
                                <div className="flex gap-2 mt-4">
                                    {[...Array(MAX_MISTAKES_ROSCO)].map((_, i) => (
                                        <div 
                                            key={i} 
                                            className={`w-4 h-4 rounded-full transition-all duration-700 border-2 ${i < mistakes ? 'bg-red-500/10 border-red-500/20' : 'bg-rose-500 border-rose-300 shadow-[0_0_10px_rgba(244,63,94,0.4)]'}`}
                                        ></div>
                                    ))}
                                </div>
                            </div>
                            {items.map((item, i) => {
                                const angle = (i / items.length) * 2 * Math.PI - Math.PI / 2;
                                const x = 50 + 42 * Math.cos(angle);
                                const y = 50 + 42 * Math.sin(angle);
                                const status = ans[i];
                                const active = i === idx;
                                let bgColor = 'bg-slate-300 dark:bg-slate-800/40 text-slate-500 opacity-20';
                                if (status === 'correct') bgColor = 'bg-green-500 text-white shadow-[0_0_10px_rgba(34,197,94,0.4)] opacity-100';
                                else if (status === 'wrong') bgColor = 'bg-red-500 text-white opacity-100';
                                else if (active) bgColor = 'bg-indigo-600 text-white scale-125 z-20 shadow-xl ring-4 ring-indigo-500/20 opacity-100';
                                else if (!item.disabled) bgColor = 'bg-slate-400 dark:bg-slate-700 text-white opacity-100';

                                return (
                                    <div key={i} className={`absolute w-7 h-7 md:w-9 md:h-9 rounded-full flex items-center justify-center text-[10px] font-bold transition-all duration-300 ${bgColor}`} 
                                         style={{ left: `${x}%`, top: `${y}%`, transform: 'translate(-50%, -50%)' }}>
                                        {item.letter}
                                    </div>
                                );
                            })}
                        </div>
                        <div className="flex flex-col gap-4">
                            <div className={`glass p-8 rounded-[2.5rem] border-l-8 transition-all duration-500 min-h-[160px] flex flex-col justify-center relative ${feedback ? 'border-red-500 bg-red-500/5' : 'border-indigo-600'}`}>
                                {feedback ? (
                                    <div className="text-center">
                                        <h4 className="text-red-500 font-black uppercase text-[10px] mb-2 tracking-widest italic">ERROR</h4>
                                        <p className="text-2xl font-black text-red-500 leading-tight">{feedback}</p>
                                    </div>
                                ) : (
                                    <>
                                        <h4 className="text-[12px] uppercase font-black tracking-widest text-indigo-500 mb-3 flex items-center gap-2 italic">
                                            {items[idx].titleLabel}
                                        </h4>
                                        <p className="text-xl md:text-2xl font-bold leading-relaxed text-slate-900 dark:text-white italic">"{items[idx].definition}"</p>
                                    </>
                                )}
                            </div>
                            <input 
                                ref={inputRef}
                                type="text" 
                                value={input} 
                                disabled={locked} 
                                onChange={e => setInput(e.target.value)} 
                                onKeyDown={e => e.key === 'Enter' && check()} 
                                placeholder="Escribe tu respuesta..." 
                                className="w-full p-6 glass rounded-2xl border-2 border-indigo-600/10 focus:border-indigo-600 outline-none text-2xl font-black text-slate-900 dark:text-white transition-all bg-white/50 dark:bg-slate-900/50" 
                                autoFocus
                            />
                            <div className="grid grid-cols-2 gap-3">
                                <button onClick={check} disabled={locked} className="py-4 bg-green-500 text-white rounded-xl font-black shadow-lg hover:bg-green-400 transition-colors uppercase italic text-sm">Comprueba</button>
                                <button onClick={() => next(ans, mistakes)} disabled={locked} className="py-4 bg-amber-500 text-white rounded-xl font-black shadow-lg hover:bg-amber-400 transition-colors uppercase italic text-sm">PASA   PALABRA</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const Ahorcado = ({ items, onBack }) => {
            const [cur, setCur] = useState(0);
            const [used, setUsed] = useState([]);
            const [fails, setFails] = useState(0);
            const word = items[cur].word.toUpperCase();
            const won = word.split('').every(l => used.includes(l) || l === ' ');
            const lost = fails >= MAX_MISTAKES_AHORCADO; 
            const guess = (l) => { if (!used.includes(l) && !won && !lost) { setUsed([...used, l]); if (!word.includes(l)) setFails(f => f + 1); } };
            
            return (
                <div className="max-w-4xl mx-auto h-[calc(100vh-140px)] flex flex-col gap-4 overflow-hidden px-2 animate-in-up">
                    <div className="flex justify-between items-center px-2 shrink-0">
                        <div className="text-left">
                            <h2 className="text-xl md:text-2xl font-black tracking-tighter text-slate-900 dark:text-white uppercase italic leading-none">AHORCADO</h2>
                            <p className="opacity-50 font-black uppercase text-[8px] tracking-[0.2em] text-slate-600 dark:text-indigo-300 italic mt-1 leading-none">IDENTIFICACIÓN • NIVEL {cur + 1} / {items.length}</p>
                        </div>
                    </div>

                    <div className="flex-grow flex flex-col md:flex-row gap-6 items-center justify-center overflow-hidden">
                        <div className="glass p-5 rounded-3xl flex flex-col items-center border-b-4 border-indigo-600 shadow-xl w-full max-w-[200px] shrink-0">
                            <svg width="130" height="160" viewBox="0 0 200 250" className="stroke-slate-900 dark:stroke-white fill-none stroke-[8]">
                                <path d="M20 230 L180 230 M60 230 L60 20 L140 20 L140 50" />
                                {fails > 0 && <circle cx="140" cy="80" r="25" />}
                                {fails > 1 && <line x1="140" y1="105" x2="140" y2="170" />}
                                {fails > 2 && <line x1="140" y1="120" x2="110" y2="150" />}
                                {fails > 3 && <line x1="140" y1="120" x2="170" y2="150" />}
                                {fails > 4 && <line x1="140" y1="170" x2="110" y2="210" />}
                                {fails > 5 && <line x1="140" y1="170" x2="170" y2="210" />}
                            </svg>
                        </div>

                        <div className="flex-grow w-full flex flex-col gap-6 overflow-hidden">
                            <div className="bg-indigo-600/5 p-5 rounded-2xl border border-indigo-600/10 shadow-sm shrink-0">
                                <span className="text-[9px] uppercase font-black tracking-widest text-indigo-500 mb-2 block italic">PISTA DEL CONCEPTO</span>
                                <p className="text-lg font-bold italic text-slate-900 dark:text-white leading-tight">"{items[cur].hint}"</p>
                            </div>
                            
                            <div className="flex flex-wrap justify-center gap-1.5 shrink-0 py-2">
                                {word.split('').map((l, i) => (
                                    <div key={i} className="hangman_slot text-slate-900 dark:text-white border-indigo-600/40">
                                        {used.includes(l) || lost ? l : l === ' ' ? ' ' : ''}
                                    </div>
                                ))}
                            </div>

                            {(won || lost) && (
                                <div className={`p-5 rounded-2xl text-white text-center shadow-xl animate-in zoom-in border-2 shrink-0 ${won ? 'bg-green-600' : 'bg-red-600'}`}>
                                    <h3 className="text-base font-black mb-3 uppercase italic tracking-tight">{won ? '¡Identificado!' : `No logrado. Era: ${word}`}</h3>
                                    <button onClick={() => { if (cur < items.length - 1) { setCur(cur + 1); setUsed([]); setFails(0); } else onBack(); }} className="bg-white text-slate-900 px-8 py-2 rounded-xl font-black text-xs hover:scale-105 transition-all">
                                        {cur < items.length - 1 ? 'SIGUIENTE' : 'FINALIZAR'}
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>

                    <div className="grid grid-cols-7 sm:grid-cols-9 lg:grid-cols-10 gap-2 max-w-2xl mx-auto pb-6 shrink-0">
                        {ALPHABET.map(l => (
                            <button 
                                key={l} 
                                disabled={used.includes(l) || won || lost} 
                                onClick={() => guess(l)} 
                                className={`p-2.5 rounded-xl font-black transition-all text-sm ${used.includes(l) ? 'opacity-10 grayscale' : 'glass bg-white dark:bg-slate-900 text-slate-900 dark:text-white border border-indigo-600/10 hover:bg-indigo-600 hover:text-white hover:scale-110'}`}
                            >
                                {l}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const Sopa = ({ items, onBack }) => {
            const [cur, setCur] = useState(0);
            const [grid, setGrid] = useState([]);
            const [found, setFound] = useState([]);
            const [sel, setSel] = useState([]);
            const [solvedCells, setSolvedCells] = useState([]); 
            const SIZE = 12;

            useEffect(() => {
                const g = Array(SIZE).fill(null).map(() => Array(SIZE).fill(''));
                items[cur].words.forEach(w => {
                    let ok = false;
                    while(!ok) {
                        const h = Math.random() > 0.5;
                        const r = Math.floor(Math.random() * (h ? SIZE : SIZE - w.length));
                        const c = Math.floor(Math.random() * (h ? SIZE - w.length : SIZE));
                        let can = true;
                        for(let i=0; i<w.length; i++) {
                            const char = g[h?r:r+i][h?c+i:c];
                            if(char !== '' && char !== w[i]) can = false;
                        }
                        if(can) { for(let i=0; i<w.length; i++) g[h?r:r+i][h?c+i:c] = w[i]; ok = true; }
                    }
                });
                for(let r=0; r<SIZE; r++) for(let c=0; c<SIZE; c++) if(g[r][c] === '') g[r][c] = ALPHABET[Math.floor(Math.random()*ALPHABET.length)];
                setGrid(g); setFound([]); setSel([]); setSolvedCells([]);
            }, [cur]);

            const handleClick = (r, c) => {
                if (solvedCells.some(cell => cell.r === r && cell.c === c)) return;
                const s = sel.find(x => x.r === r && x.c === c);
                let ns = s ? sel.filter(x => !(x.r === r && x.c === c)) : [...sel, {r, c}];
                setSel(ns);
                const str = ns.map(x => grid[x.r][x.c]).join('');
                const rev = str.split('').reverse().join('');
                const m = items[cur].words.find(w => (w === str || w === rev) && !found.includes(w));
                if (m) { setFound([...found, m]); setSolvedCells([...solvedCells, ...ns]); setSel([]); }
            };

            return (
                <div className="max-w-6xl mx-auto h-[calc(100vh-140px)] flex flex-col px-4 animate-in-up">
                    <div className="flex justify-between items-center mb-6 px-2 shrink-0">
                        <div className="text-left">
                            <h2 className="text-xl md:text-2xl font-black tracking-tighter text-slate-900 dark:text-white uppercase italic leading-none">SOPA DE LETRAS</h2>
                            <p className="opacity-50 font-black uppercase text-[8px] tracking-[0.2em] text-slate-600 dark:text-indigo-300 italic mt-1 leading-none">BÚSQUEDA • NIVEL {cur + 1} / {items.length}</p>
                        </div>
                    </div>

                    <div className="flex-grow grid lg:grid-cols-3 gap-8 overflow-hidden pb-4">
                        <div className="lg:col-span-2 glass p-4 rounded-[2.5rem] border-2 border-indigo-600/10 bg-white/50 dark:bg-slate-900/50 flex items-center justify-center overflow-hidden">
                            <div className="grid grid-cols-12 gap-1 md:gap-2 aspect-square w-full max-w-[480px]">
                                {grid.map((row, r) => row.map((char, c) => {
                                    const isSelected = sel.some(x => x.r === r && x.c === c);
                                    const isSolved = solvedCells.some(x => x.r === r && x.c === c);
                                    return (
                                        <button 
                                            key={`${r}-${c}`} 
                                            onClick={() => handleClick(r, c)} 
                                            className={`aspect-square flex items-center justify-center text-[10px] md:text-sm font-bold rounded-md transition-all ${isSelected ? 'bg-indigo-600 text-white shadow-lg' : isSolved ? 'bg-green-500 text-white shadow-md' : 'text-slate-700 dark:text-white hover:bg-indigo-600/10'}`}
                                        >
                                            {char}
                                        </button>
                                    );
                                }))}
                            </div>
                        </div>
                        <div className="flex flex-col gap-6 overflow-hidden">
                            <div className="bg-indigo-600 p-6 rounded-[2.5rem] text-white shadow-2xl relative shrink-0">
                                <h3 className="text-sm font-black mb-6 uppercase tracking-[0.2em] border-b border-white/10 pb-3 italic">CONCEPTOS</h3>
                                <div className="space-y-3 overflow-y-auto max-h-[260px] pr-2 scrollbar-hide">
                                    {items[cur].words.map(w => (
                                        <div key={w} className={`flex items-center gap-3 font-bold text-sm transition-all duration-500 ${found.includes(w) ? 'opacity-30 line-through' : ''}`}>
                                            <div className={`w-3.5 h-3.5 rounded-full border-2 ${found.includes(w) ? 'bg-white border-white' : 'border-white/30'}`} />
                                            <span className="tracking-wide uppercase italic">{w}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                            {found.length === items[cur].words.length && (
                                <button onClick={() => cur < items.length - 1 ? setCur(cur + 1) : onBack()} className="w-full py-6 bg-green-500 text-white rounded-[2rem] font-black text-xl shadow-2xl hover:bg-green-400 uppercase italic">
                                    {cur < items.length - 1 ? 'Siguiente Reto' : 'Finalizar Juego'}
                                </button>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const ParejasReto = ({ levels, onBack }) => {
            const [lv, setLv] = useState(0);
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [matched, setMatched] = useState([]);
            const [tries, setTries] = useState(0);

            useEffect(() => {
                const prepared = [];
                levels[lv].elements.forEach((word, idx) => {
                    prepared.push({ val: word, pairId: idx, id: `c-${idx}-a` });
                    prepared.push({ val: word, pairId: idx, id: `c-${idx}-b` });
                });
                setCards(prepared.sort(() => Math.random() - 0.5));
                setFlipped([]); setMatched([]); setTries(0);
            }, [lv]);

            const onCardClick = (card) => {
                if (flipped.length === 2 || matched.includes(card.id) || flipped.includes(card.id)) return;
                const nf = [...flipped, card.id];
                setFlipped(nf);
                if (nf.length === 2) {
                    setTries(t => t + 1);
                    const c1 = cards.find(c => c.id === nf[0]);
                    const c2 = cards.find(c => c.id === nf[1]);
                    if (c1.pairId === c2.pairId) { setMatched(prev => [...prev, c1.id, c2.id]); setFlipped([]); }
                    else { setTimeout(() => setFlipped([]), 1000); }
                }
            };

            const win = matched.length === cards.length && cards.length > 0;

            return (
                <div className="w-screen h-[calc(100vh-140px)] flex flex-col px-6 space-y-4 animate-in-up overflow-hidden">
                    <div className="flex justify-between items-center px-4 shrink-0">
                        <div className="text-left">
                            <h2 className="text-xl md:text-2xl font-black tracking-tighter text-slate-900 dark:text-white uppercase italic leading-none">{levels[lv].title}</h2>
                            <p className="opacity-50 font-black uppercase text-[8px] tracking-[0.2em] text-slate-600 dark:text-indigo-300 italic mt-1 leading-none">MEMORIA VISUAL • NIVEL {lv + 1} / {levels.length}</p>
                        </div>
                        <div className="glass px-6 py-2 rounded-2xl border-b-2 border-indigo-600 flex gap-8 text-slate-900 dark:text-white shadow-lg bg-white/20 dark:bg-slate-900/40">
                            <div className="flex flex-col items-center">
                                <span className="text-lg font-black text-indigo-500 leading-none">{tries}</span> 
                                <span className="text-[8px] uppercase font-black opacity-50 mt-1">Intentos</span>
                            </div>
                            <div className="flex flex-col items-center">
                                <span className="text-lg font-black text-green-500 leading-none">{matched.length/2}</span> 
                                <span className="text-[8px] uppercase font-black opacity-50 mt-1">Éxitos</span>
                            </div>
                        </div>
                    </div>
                    
                    <div className="flex-grow flex items-center justify-center relative overflow-hidden pb-10">
                        <div className="h-full w-full grid grid-rows-3 grid-flow-col gap-4 auto-cols-fr overflow-x-auto scrollbar-hide px-4" style={{ marginTop: '20px' }}>
                            {cards.map(card => {
                                const isF = flipped.includes(card.id) || matched.includes(card.id);
                                const isM = matched.includes(card.id);
                                return (
                                    <div key={card.id} className="h-full min-w-[150px] md:min-w-[200px] perspective-1000" onClick={() => onCardClick(card)}>
                                        <div className={`w-full h-full relative preserve-3d transition-transform duration-500 cursor-pointer ${isF ? 'rotate-y-180' : ''}`}>
                                            <div className="absolute inset-0 card-back-pcb rounded-[2rem] backface-hidden flex items-center justify-center border-2 border-white/10 shadow-xl">
                                                <div className="w-14 h-14 bg-white/10 rounded-2xl flex items-center justify-center backdrop-blur-md">
                                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-7 w-7 text-indigo-100/40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect></svg>
                                                </div>
                                            </div>
                                            <div className={`absolute inset-0 rounded-[2rem] backface-hidden rotate-y-180 flex items-center justify-center text-center px-6 py-3 shadow-xl border-2 transition-all duration-500 ${isM ? 'bg-green-500/10 border-green-500 text-green-600 dark:text-green-400' : 'glass border-indigo-600 dark:border-indigo-600/20 bg-white dark:bg-slate-900 text-slate-900 dark:text-white'}`}>
                                                <span className={`font-black uppercase tracking-tighter leading-tight select-none ${card.val.length > 15 ? 'text-[10px]' : 'text-xs md:text-sm lg:text-base'}`}>
                                                    {card.val}
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>

                    {win && (
                        <div className="absolute inset-0 z-50 flex items-center justify-center p-6 bg-slate-950/90 backdrop-blur-3xl">
                            <div className="glass p-14 rounded-[4rem] text-center space-y-10 animate-in zoom-in border-4 border-indigo-500/20 shadow-3xl">
                                <h3 className="text-6xl font-black tracking-tighter text-white uppercase italic leading-none">Superado</h3>
                                <button onClick={() => { if (lv < levels.length - 1) setLv(lv + 1); else onBack(); }} className="bg-indigo-600 text-white px-24 py-6 rounded-3xl font-black text-2xl shadow-2xl hover:scale-105 transition-all uppercase italic">
                                    {lv < levels.length - 1 ? 'SIGUIENTE NIVEL' : 'FINALIZAR'}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // --- APP PRINCIPAL ---

        const App = () => {
            const [view, setView] = useState('HOME');
            const [data, setData] = useState(null);
            const [isAutoLoaded, setIsAutoLoaded] = useState(false);
            const [theme, setTheme] = useState(() => localStorage.getItem('edupanel-theme') || 'dark');
            const fileRef = useRef();

            useEffect(() => {
                fetch('datos.csv')
                    .then(res => res.ok ? res.text() : Promise.reject())
                    .then(text => { setData(parseRawData(text)); setIsAutoLoaded(true); })
                    .catch(() => console.log("Cargue CSV."));
            }, []);

            useEffect(() => { 
                document.documentElement.className = theme; 
                localStorage.setItem('edupanel-theme', theme); 
            }, [theme]);
            
            const parseRawData = (text) => {
                const lines = text.split(/\r?\n/);
                const rosco = [], hangman = [], sopa = [], pareja = [];
                for (let i = 1; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line || line.startsWith('#')) continue; 
                    const cols = line.split(';').map(c => c.trim());
                    const tipo = cols[0]?.toLowerCase();

                    if (tipo === 'rosco' && cols.length >= 5) {
                        rosco.push({ mode: cols[1], letter: cols[2], definition: cols[3], word: cols[4].toUpperCase() });
                    }
                    else if (tipo === 'ahorcado' && cols[1] && cols[2]) {
                        hangman.push({ hint: cols[1], word: cols[2].toUpperCase() });
                    }
                    else if (tipo === 'sopa' && cols[2]) {
                        const ws = cols.slice(2).filter(w => w && w.length > 1).map(w => w.toUpperCase());
                        if (ws.length) sopa.push({ title: cols[1] || "Conceptos", words: ws });
                    }
                    else if (tipo === 'pareja' && cols[2]) {
                        const els = cols.slice(2).filter(e => e && e.length > 0);
                        if (els.length > 0) pareja.push({ title: cols[1] || "Asociación", elements: els });
                    }
                }
                return { rosco, hangman, sopa, pareja };
            };

            const downloadSampleCSV = () => {
                const content = `rosco;empieza;A;Conjunto de instrucciones que sigue un ordenador;algoritmo
rosco;empieza;B;Variable que solo puede tormar dos valores;booleana
rosco;empieza;c;Lenguaje de programación muy extendido;c
rosco;empieza;d;Palabra reservada que se utiliza para declarar una función en Python;def
rosco;contiene;e;Elemento de memoria que guarda un valor;variable
rosco;empieza;f;Plataforma de videos en línea;fuego
rosco;empieza;g;Animal de compañia;gato
rosco;empieza;h;Algo muy frio;hielo

# JUEGO DEL AHORCADO
ahorcado;Lenguaje de marcas para páginas web;HIPERTEXTO
ahorcado;Editor de texto plano para desarrollo;NOTEPADPLUSPLUS

# JUEGO DE LA SOPA DE LETRAS
sopa;Formatos de archivo de audio;MP3;WAV;OGG;AAC;FLAC;M4A
sopa;Formatos de archivo de video;MP4;AVI;MKV;MOV;WEBM;FLV

# JUEGO DE LAS PAREJAS
pareja;Lenguaje WEB;HTML;JAVASCRIPT;OL;UL;HEADER;FOOTER
pareja;Hardware;TECLADO;RATON;PANTALLA;TORRE;PLACA;MICRO`;
                const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.setAttribute("download", "datos_ejemplo.csv");
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const GameCard = ({ title, desc, icon, color, active, count, onClick }) => (
                <button disabled={!active} onClick={onClick} className={`p-8 rounded-[3rem] text-left transition-all flex flex-col group h-full shadow-2xl relative overflow-hidden ${active ? 'glass bg-white dark:bg-slate-900 border-2 border-indigo-600/5 hover:border-indigo-600/40 hover:-translate-y-2' : 'opacity-10 grayscale border-dashed border-2 cursor-not-allowed'}`}>
                    <div className={`w-16 h-16 ${color} rounded-[1.5rem] flex items-center justify-center text-4xl mb-6 shadow-2xl group-hover:scale-110 transition-all duration-500`}>{icon}</div>
                    <h3 className="text-2xl font-black mb-2 tracking-tighter text-slate-900 dark:text-white uppercase italic">{title}</h3>
                    <p className="text-[11px] opacity-60 mb-10 text-slate-600 dark:text-slate-400 font-medium leading-relaxed italic">{desc}</p>
                    <div className="mt-auto pt-5 border-t border-slate-900/10 dark:border-white/10 flex justify-between items-center">
                        <span className="text-[9px] font-black uppercase tracking-[0.2em] text-indigo-500">{active ? `${count} Entradas` : 'Repositorio Vacío'}</span>
                        {active && <span className="text-2xl text-indigo-500 group-hover:translate-x-3 transition-all duration-500 font-bold">→</span>}
                    </div>
                </button>
            );

            return (
                <div className="min-h-screen flex flex-col font-sans transition-all duration-500 bg-slate-50 dark:bg-slate-950 overflow-hidden">
                    <nav className="sticky top-0 z-50 glass border-b border-indigo-600/10 px-8 py-3.5 flex justify-between items-center shrink-0 bg-white/70 dark:bg-slate-950/70">
                        <div onClick={() => setView('HOME')} className="flex items-center gap-4 cursor-pointer group">
                            <div className="bg-indigo-600 p-3 rounded-2xl text-white shadow-xl group-hover:scale-110 transition-all">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                            </div>
                            <div>
                                <h1 className="text-xl font-black tracking-tighter text-slate-900 dark:text-white leading-none uppercase italic">EduPanel v7.9</h1>
                                <span className="text-[9px] uppercase font-black tracking-[0.4em] text-indigo-500 leading-none tracking-widest">Módulo Académico</span>
                            </div>
                        </div>
                        <button onClick={() => setTheme(theme === 'dark' ? 'light' : 'dark')} className="p-3.5 glass rounded-2xl hover:scale-110 transition-all text-xl shadow-lg border-2 border-indigo-600/10">{theme === 'dark' ? '☀️' : '🌙'}</button>
                    </nav>

                    <main className="flex-grow flex items-center justify-center p-4 overflow-hidden">
                        {view === 'HOME' ? (
                            <div className="container mx-auto px-6 w-full max-w-7xl grid grid-cols-1 lg:grid-cols-12 gap-8 overflow-y-auto max-h-[85vh] scrollbar-hide py-4">
                                {!isAutoLoaded && (
                                    <div className="lg:col-span-4 glass p-10 rounded-[4rem] shadow-3xl space-y-8 border-indigo-600/5 border-2 h-fit bg-white/30 dark:bg-slate-900/30">
                                        <h2 className="text-3xl font-black tracking-tighter text-slate-900 dark:text-white italic uppercase leading-none">Repositorio</h2>
                                        <p className="text-[10px] opacity-60 text-slate-700 dark:text-indigo-100 font-bold uppercase tracking-widest leading-relaxed">Suba el archivo .CSV para activar los juegos.</p>
                                        
                                        <div className="space-y-4">
                                            <button onClick={() => fileRef.current.click()} className="w-full py-5 bg-indigo-600 text-white rounded-[1.5rem] font-black text-lg shadow-2xl flex items-center justify-center gap-4 hover:scale-105 active:scale-95 transition-all group italic uppercase tracking-tighter">
                                                Seleccionar CSV
                                            </button>
                                            <button onClick={downloadSampleCSV} className="w-full py-4 border-2 border-indigo-600/20 text-indigo-600 dark:text-indigo-400 rounded-[1.5rem] font-black text-xs shadow-xl flex items-center justify-center gap-3 hover:bg-indigo-600/5 transition-all uppercase italic">
                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                                                Descargar Ejemplo
                                            </button>
                                        </div>

                                        <input type="file" ref={fileRef} className="hidden" accept=".csv" onChange={e => { const file = e.target.files[0]; if (file) { const reader = new FileReader(); reader.onload = (ev) => setData(parseRawData(ev.target.result)); reader.readAsText(file); } }} />
                                    </div>
                                )}
                                <div className={`${isAutoLoaded ? 'max-w-6xl mx-auto col-span-12' : 'lg:col-span-8'} grid sm:grid-cols-2 gap-6 w-full`}>
                                    {(data?.rosco?.length > 0 || !data) && <GameCard title="Rosco" desc="Léxico de la A a la Z. Blindado a 5 vidas." icon="⭕" color="bg-rose-600" active={data?.rosco?.length > 0} count={data?.rosco?.length || 0} onClick={() => setView('ROSCO')} />}
                                    {(data?.hangman?.length > 0 || !data) && <GameCard title="Ahorcado" desc="Identificación mediante pistas visuales." icon="☠️" color="bg-amber-600" active={data?.hangman?.length > 0} count={data?.hangman?.length || 0} onClick={() => setView('AHORCADO')} />}
                                    {(data?.sopa?.length > 0 || !data) && <GameCard title="Sopa" desc="Búsqueda avanzada de conceptos clave." icon="🧩" color="bg-sky-600" active={data?.sopa?.length > 0} count={data?.sopa?.length || 0} onClick={() => setView('SOPA')} />}
                                    {(data?.pareja?.length > 0 || !data) && <GameCard title="Parejas" desc="Memoria visual y asociación técnica." icon="🔗" color="bg-indigo-600" active={data?.pareja?.length > 0} count={data?.pareja?.length || 0} onClick={() => setView('PAREJAS')} />}
                                </div>
                            </div>
                        ) : view === 'ROSCO' ? <Rosco roscoItems={data.rosco} onBack={() => setView('HOME')} />
                          : view === 'AHORCADO' ? <Ahorcado items={data.hangman} onBack={() => setView('HOME')} />
                          : view === 'SOPA' ? <Sopa items={data.sopa} onBack={() => setView('HOME')} />
                          : view === 'PAREJAS' ? <ParejasReto levels={data.pareja} onBack={() => setView('HOME')} />
                          : null}
                    </main>

                    <footer className="py-4 text-center text-[10px] font-black uppercase tracking-[0.5em] opacity-20 italic text-slate-900 dark:text-white shrink-0">EduPanel v7.9 • Gestión Educativa Suite</footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
