        // --- AVATARES ---
        const AVATARS = [
            "🐶", "🐱", "🐭", "🐹", "🐰", "🦊", "🐻", "🐼", "🐨", "🐯",
            "🦁", "🐮", "🐷", "🐸", "🐵", "🐔", "🐧", "🐦", "🦆", "🦅",

        // --- GLOBAL HELPERS ---
        
        const parseCSV = (text) => {
            if (!text) return { rosco: [], hangman: [], trueFalse: [], memory: [], sopa: [], clasificador: [] };
            const cleanText = text.replace(/^\uFEFF/, '');
            const lines = cleanText.split(/\r?\n/);
            
            // Inicializamos arrays
            const rosco = [], hangman = [], trueFalse = [], memory = [], sopa = [], clasificador = [];
            
            // Variables para el "título" global (usamos el primero que encontremos como fallback)
            let globalSubject = "General";
            let globalTopic = "Varios";
            let foundHeader = false;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line || line.startsWith('#') || line.startsWith('Asignatura;')) continue;
                
                const cols = line.split(';').map(c => c.trim());
                if (cols.length < 3) continue;

                // Extraer asignatura/tema de la línea actual
                const rowSubject = cols[0] || "General";
                const rowTopic = cols[1] || "Varios";
                const type = cols[2]?.toLowerCase();

                // Si es la primera línea válida, la usamos para el título de la App
                if (!foundHeader) {
                    globalSubject = rowSubject;
                    globalTopic = rowTopic;
                    foundHeader = true;
                }
                
                // Objeto base con metadatos para futura compatibilidad multitema
                const meta = { subject: rowSubject, topic: rowTopic };

                if (type === 'rosco') {
                    const hint = cols[3]; // 'empieza' or 'contiene'
                    const def = cols[5];
                    const word = cols[6];
                    const letter = cols[4];
                    if(def && word && letter) {
                         rosco.push({ ...meta, letter: letter.toUpperCase(), definition: def, word: word, hint: hint });
                    }
                } else if (type === 'ahorcado') {
                     hangman.push({ ...meta, hint: cols[3], word: cols[4] });
                } else if (type === 'pareja') {
                     for(let k=4; k<cols.length; k+=2) {
                         if(cols[k] && cols[k+1]) memory.push({ ...meta, term: cols[k], definition: cols[k+1] });
                     }
                } else if (type === 'verdadero') {
                     trueFalse.push({ ...meta, statement: cols[4], isTrue: cols[5].toUpperCase() === 'VERDADERO', explanation: cols[6] });
                } else if (type === 'sopa') {
                    // Soporte básico para que no se pierdan los datos
                    const words = cols.slice(4).filter(w => w);
                    if(words.length > 0) sopa.push({ ...meta, title: cols[3], words });
                } else if (type === 'clasificador') {
                    // Soporte básico para buckets
                    clasificador.push({ ...meta, raw: cols.slice(3) });
                }
            }
            
            // Retornamos globalSubject para el título, pero los arrays contienen la info mixta
            return { subject: globalSubject, topic: globalTopic, rosco, hangman, trueFalse, memory, sopa, clasificador };
        };

        const SAMPLE_CSV = `Asignatura;Situación de aprendizaje;Tipo;Pregunta;R1;R2;R3;R4;Tiempo;Correcta;URL Imagen
Tecnología y Digitalización 2º;La Madera;rosco;empieza;A;Madera fabricada con virutas prensadas con cola;aglomerado
Tecnología y Digitalización 2º;La Madera;rosco;empieza;B;Herramienta manual que taladra agujeros pequeños;barrena
Tecnología y Digitalización 2º;La Madera;ahorcado;Madera formada por chapas finas pegadas;CONTRACHAPADO
Tecnología y Digitalización 2º;La Madera;ahorcado;Herramienta para eliminar mucha madera rapido;ESCOFINA
Tecnología y Digitalización 2º;La Madera;ahorcado;Proceso que garantiza que la madera sea renovable;REFORESTACION
Tecnología y Digitalización 2º;La Madera;pareja;Maderas y clasificacion;PINO;BLANDA;ROBLE;DURA;CAOBA;TROPICAL
Tecnología y Digitalización 2º;La Madera;verdadero;Maderas;El pino es un ejemplo de madera dura;FALSO;El pino es una madera blanda de crecimiento rapido`;

        const buildStructure = (data) => {
            if (!data) return {};
            const struct = {};

                if (!arr) return;

                    const s = item.subject || "General";

                    struct[s].add(t);
                });

            collect(data.rosco);
            collect(data.hangman);
            collect(data.trueFalse);
            collect(data.memory);
            collect(data.sopa);
            collect(data.clasificador);

            const result = {};
            Object.keys(struct).sort().forEach(key => {
                result[key] = Array.from(struct[key]).sort();
            });
            return result;
        };

        const ReportsTab = ({ reports, loading, error, onRefresh }) => {
            const [filterSubject, setFilterSubject] = useState('Todas');
            const [filterTopic, setFilterTopic] = useState('Todos');
            const [filterUser, setFilterUser] = useState('');
            const [filterAppId, setFilterAppId] = useState('');

            // Helper to get value case-insensitively from object
            const getValue = (obj, keys) => {
                if (!obj) return undefined;
                const objKeys = Object.keys(obj);
                for (let key of keys) {
                    if (obj[key] !== undefined) return obj[key]; // Exact match
                    const found = objKeys.find(k => k.toLowerCase().trim() === key.toLowerCase()); // Fuzzy match
                    if (found) return obj[found];
                }
                return undefined;
            };

            const safeString = (val) => String(val || '').trim();

            const subjects = useMemo(() => {
                if (!Array.isArray(reports)) return ['Todas'];
                const s = new Set(
                    reports
                        .filter(r => r) // remove nulls
                        .map(r => safeString(getValue(r, ['subject', 'asignatura']) || 'General'))
                        .filter(Boolean)
                );
                return ['Todas', ...Array.from(s).sort()];
            }, [reports]);

            const topics = useMemo(() => {
                if (!Array.isArray(reports)) return ['Todos'];
                const t = new Set(
                    reports
                        .filter(r => r)
                        .map(r => safeString(getValue(r, ['topic', 'situacion', 'tema']) || 'General'))
                        .filter(Boolean)
                );
                return ['Todos', ...Array.from(t).sort()];
            }, [reports]);

            const filteredReports = useMemo(() => {
                if (!Array.isArray(reports)) return [];
                return reports.filter(r => {
                    if (!r) return false;
                    
                    const rSubject = safeString(getValue(r, ['subject', 'asignatura']) || 'General');
                    const rTopic = safeString(getValue(r, ['topic', 'situacion', 'tema']) || 'General');
                    const rUser = safeString(getValue(r, ['user', 'alumno', 'usuario', 'nombre']));
                    const rAppId = safeString(getValue(r, ['appId', 'id_app', 'id', 'app_id']));
                    
                    const matchSubject = filterSubject === 'Todas' || rSubject === filterSubject;
                    const matchTopic = filterTopic === 'Todos' || rTopic === filterTopic;
                    const matchUser = filterUser === '' || rUser.toLowerCase().includes(filterUser.toLowerCase());
                    const matchAppId = filterAppId === '' || rAppId.toLowerCase().includes(filterAppId.toLowerCase());
                    
                    return matchSubject && matchTopic && matchUser && matchAppId;
                });
            }, [reports, filterSubject, filterTopic, filterUser, filterAppId]);

            if (loading) return (
                <div className="flex flex-col items-center justify-center p-12 text-indigo-500 animate-pulse">
                    <span className="text-4xl mb-2">📊</span>
                    <p className="font-bold">Cargando datos de Google Sheets...</p>
                </div>
            );
            
            if (error) return (
                <div className="p-8 text-center text-red-500 bg-red-50 dark:bg-red-900/20 rounded-2xl border border-red-200 dark:border-red-800">

                </div>
            );

            return (
                <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                     <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                        <div>
                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">ID App</label>
                            <input 
                                type="text" 
                                value={filterAppId} 
                                onChange={e => setFilterAppId(e.target.value)} 
                                placeholder="Filtrar por ID..."
                                className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-indigo-500 outline-none transition-all placeholder:text-slate-400"
                            />
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Alumno</label>
                            <input 
                                type="text" 
                                value={filterUser} 
                                onChange={e => setFilterUser(e.target.value)} 
                                placeholder="Buscar nombre..."
                                className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-indigo-500 outline-none transition-all placeholder:text-slate-400"
                            />
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Asignatura</label>
                            <select value={filterSubject} onChange={e => setFilterSubject(e.target.value)} className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                                {subjects.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                        </div>
                        <div className="flex gap-2">
                            <div className="flex-1">
                                <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Tema</label>
                                <select value={filterTopic} onChange={e => setFilterTopic(e.target.value)} className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                                    {topics.map(t => <option key={t} value={t}>{t}</option>)}

                            </div>
                            <div className="flex items-end">

                            </div>

                     </div>
                     
                     <div className="overflow-hidden rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xl bg-white dark:bg-slate-900 min-h-[200px]">

                                                {Array.isArray(reports) && reports.length > 0 ? "No hay coincidencias con los filtros seleccionados." : (
                                                    <div className="flex flex-col items-center gap-4">
                                                        <span>No hay registros disponibles.</span>

                                                            <strong>⚠️ ¿Tabla vacía pero tienes datos?</strong>

                                                        <button onClick={onRefresh} className="px-4 py-2 bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600 dark:text-indigo-300 rounded-lg text-sm font-bold hover:bg-indigo-100 transition-colors">Actualizar Tabla</button>
                                                    </div>
                                                )}
                                            </td>
                                        </tr>
                                    ) : (
                                        filteredReports.map((row, i) => (
                                            <tr key={i} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                                <td className="p-4 text-slate-500">{(() => {
                                                    const dateVal = getValue(row, ['timestamp', 'fecha']);
                                                    if (!dateVal) return '-';
                                                    return new Date(dateVal).toLocaleString('es-ES', {
                                                        day: '2-digit',
                                                        month: '2-digit',
                                                        year: 'numeric',
                                                        hour: '2-digit',
                                                        minute: '2-digit'
                                                    });
                                                })()}</td>
                                                <td className="p-4 text-xs font-mono text-slate-400">{getValue(row, ['appId', 'id_app']) || '-'}</td>
                                                <td className="p-4 font-bold text-slate-700 dark:text-slate-200">{getValue(row, ['user', 'alumno']) || 'Anónimo'}</td>
                                                <td className="p-4">
                                                    <span className={`px-2 py-1 rounded-md text-xs font-bold uppercase tracking-wider ${
                                                        safeString(getValue(row, ['game', 'juego'])).includes('rosco') ? 'bg-pink-100 text-pink-700 dark:bg-pink-900/30 dark:text-pink-300' :
                                                        safeString(getValue(row, ['game', 'juego'])).includes('ahorcado') ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300' :
                                                        'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300'
                                                    }`}>
                                                        {getValue(row, ['game', 'juego'])}
                                                    </span>
                                                </td>
                                                <td className="p-4 text-slate-600 dark:text-slate-400">{getValue(row, ['subject', 'asignatura'])}</td>
                                                <td className="p-4 text-slate-600 dark:text-slate-400">{getValue(row, ['topic', 'situacion'])}</td>
                                                <td className="p-4 text-right font-black text-indigo-600 dark:text-indigo-400 text-lg">{getValue(row, ['score', 'puntuacion']) || 0}</td>
                                                <td className="p-4 text-right font-mono text-slate-500">
                                                    {(() => {
                                                        const t = getValue(row, ['time', 'tiempo']);
                                                        if (!t) return '-';
                                                        let str = String(t).trim();
                                                        if (str.startsWith("'")) {
                                                            str = str.substring(1);
                                                        }
                                                        
                                                        if (str.includes('T') && str.includes('Z')) {
                                                            try {
                                                                const date = new Date(str);
                                                                if (!isNaN(date.getTime())) {
                                                                    const h = date.getUTCHours().toString().padStart(2, '0');
                                                                    const m = date.getUTCMinutes().toString().padStart(2, '0');
                                                                    const s = date.getUTCSeconds().toString().padStart(2, '0');
                                                                    return `${h}:${m}:${s}`;
                                                                }
                                                            } catch(e) {}
                                                        }
                                                        if (str.includes(':')) return str;
                                                        const sec = parseInt(t, 10);
                                                        if (isNaN(sec)) return '-';
                                                        const h = Math.floor(sec / 3600).toString().padStart(2, '0');
                                                        const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
                                                        const s = (sec % 60).toString().padStart(2, '0');
                                                        return `${h}:${m}:${s}`;
                                                    })()}
                                                </td>
                                            </tr>
                                        ))
                                    )}

            const currentConfig = useMemo(() => {

            const structure = useMemo(() => {
                if (!data) return {};
                const struct = {};
                
                const collect = (arr) => {
                    if(!arr) return;

const ADMIN_PASSWORD = "1234"; 

function doGet(e) {
  const type = e.parameter.type;
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  
  if (type === 'config') {
    const sheet = ss.getSheetByName('Config');
    const data = sheet.getRange('A1').getValue();
    return ContentService.createTextOutput(data || "{}").setMimeType(ContentService.MimeType.JSON);
  } 
  
  if (type === 'reports') {
    const sheet = ss.getSheetByName('Reportes');
    const rows = sheet.getDataRange().getValues();
    const headers = rows.shift(); // Eliminar cabecera
    const reports = rows.map(row => {
      let obj = {};
      headers.forEach((h, i) => obj[h.toLowerCase()] = row[i]);
      return obj;
    }).reverse(); // Más recientes primero
    return ContentService.createTextOutput(JSON.stringify(reports)).setMimeType(ContentService.MimeType.JSON);
  }
}

function doPost(e) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const data = JSON.parse(e.postData.contents);
  
  if (data.type === 'login') {
    if(data.user === 'Bedoya' && data.password === ADMIN_PASSWORD) {
       return ContentService.createTextOutput(JSON.stringify({result: 'success'})).setMimeType(ContentService.MimeType.JSON);
    }
    return ContentService.createTextOutput(JSON.stringify({result: 'error'})).setMimeType(ContentService.MimeType.JSON);
  }

  if (data.type === 'saveConfig') {
    const sheet = ss.getSheetByName('Config');
    sheet.getRange('A1').setValue(JSON.stringify(data.config));
    return ContentService.createTextOutput(JSON.stringify({result: 'success'})).setMimeType(ContentService.MimeType.JSON);
  }

  if (data.type === 'report') {
    const sheet = ss.getSheetByName('Reportes');
    const r = data.report;
    const date = new Date();
    // Orden de columnas: Fecha, ID App, Usuario, Juego, Asignatura, Tema, Puntuación, Tiempo
    sheet.appendRow([date, r.appId, r.user, r.game, r.subject, r.topic, r.score, r.time]);
    return ContentService.createTextOutput(JSON.stringify({result: 'success'})).setMimeType(ContentService.MimeType.JSON);
  }
}`}

            const [lives, setLives] = useState(5);
            const [feedback, setFeedback] = useState(null); 
            const [startTime] = useState(Date.now());
            const [isSaving, setIsSaving] = useState(false);

            // Logic to randomize if there are duplicate letters, and sort A-Z
            const gameItems = useMemo(() => {
                if (!data || data.length === 0) return [];
                const groups = {};
                // Group by letter
                data.forEach(item => {
                    const l = item.letter.charAt(0).toUpperCase();
                    if (!groups[l]) groups[l] = [];
                    groups[l].push(item);
                });
                // Pick one random from each group and sort alphabetically
                const sortedKeys = Object.keys(groups).sort();
                return sortedKeys.map(key => {
                    const group = groups[key];
                    // Random choice if more than one definition for the same letter
                    return group[Math.floor(Math.random() * group.length)];
                });
            }, [data]);

            const currentItem = gameItems[currentIdx];

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const saveReport = async (finalScore) => {
                const timeSpent = Math.floor((Date.now() - startTime) / 1000);
                const timeFormatted = formatTime(timeSpent);
                setIsSaving(true);
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            type: 'report',
                            report: {
                                appId: getAppId(),
                                user: user,
                                subject: subject,
                                topic: topic,
                                game: 'rosco',
                                score: finalScore, 
                                time: `'${timeFormatted}`
                            }
                        })
                    });
                } catch (e) {
                    console.error("Error saving report", e);
                } finally {
                    setIsSaving(false);
                }
            };

            const handleCheck = () => {
                if(!currentItem) return;
                const normalize = (str) => str.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
                const isCorrect = normalize(userInput) === normalize(currentItem.word);
                
                if (isCorrect) {
                    const newScore = score + 30;
                    setScore(newScore);
                    const newAnswers = { ...answers, [currentIdx]: 'CORRECT' };
                    setAnswers(newAnswers);
                    setUserInput('');
                    moveToNext(newAnswers);
                } else {
                    setFeedback({ word: currentItem.word });
                    setScore(s => s - 10);
                    setLives(l => l - 1);
                }
            };

            const handleFeedbackDismiss = () => {
                setFeedback(null);
                setUserInput('');
                if (lives <= 0) {
                    setGameOver(true);
                } else {
                    const newAnswers = { ...answers, [currentIdx]: 'WRONG' };
                    setAnswers(newAnswers);
                    moveToNext(newAnswers);
                }
            };

            const moveToNext = (currentAnswers) => {
                let next = (currentIdx + 1) % gameItems.length;
                let count = 0;
                while (currentAnswers[next] && currentAnswers[next] !== 'PENDING' && count < gameItems.length) {
                    next = (next + 1) % gameItems.length;
                    count++;
                }
                if (count >= gameItems.length) {
                    setGameOver(true);
                } else {
                    setCurrentIdx(next);
                }
            };

            const handlePasapalabra = () => {
                setUserInput('');
                moveToNext(answers);
            };

            useEffect(() => {
                if (gameOver && lives > 0) {
                    saveReport(score);
                }
            }, [gameOver]);

            if (gameItems.length === 0) return <div className="p-10 text-center font-bold text-slate-500">No hay datos para el Rosco.</div>;

            if (gameOver) {
                const corrects = Object.values(answers).filter(v => v === 'CORRECT').length;
                return (
                    <div className="max-w-xl mx-auto text-center p-10 bg-white dark:bg-slate-800 rounded-3xl shadow-2xl mt-10 animate-in fade-in zoom-in relative">
                        {isSaving && <div className="absolute top-4 right-4 text-xs text-indigo-500 font-bold animate-pulse">Guardando resultado...</div>}
                        <div className={`inline-block p-6 rounded-full mb-6 ${lives > 0 ? 'bg-indigo-100 dark:bg-indigo-900/30' : 'bg-red-100 dark:bg-red-900/30'}`}>
                            <span className="text-6xl">{lives > 0 ? '🏆' : '💀'}</span>
                        </div>
                        <h2 className="text-4xl font-black mb-4 dark:text-white">{lives > 0 ? '¡Rosco Terminado!' : 'Fin del Juego'}</h2>
                        <div className="grid grid-cols-2 gap-4 mb-8 text-lg font-bold">
                            <div className="p-4 bg-green-100 text-green-700 rounded-2xl border border-green-200">
                                ✅ Aciertos: {corrects}
                            </div>
                            <div className="p-4 bg-red-100 text-red-700 rounded-2xl border border-red-200">
                                ❌ Fallos: {gameItems.length - corrects}
                            </div>
                        </div>
                        <div className="p-6 bg-slate-50 dark:bg-slate-900 rounded-2xl mb-8 border-2 border-slate-200 dark:border-slate-700">
                            <p className="text-sm text-slate-500 uppercase font-bold tracking-widest mb-1">Puntuación Final</p>
                            <p className="text-5xl font-black text-indigo-600 dark:text-indigo-400">{score}</p>
                        </div>
                        <button onClick={onBack} className="px-8 py-4 bg-indigo-600 text-white rounded-2xl font-bold hover:bg-indigo-700 transition-colors shadow-xl shadow-indigo-600/20 w-full">Volver al Panel</button>
                    </div>
                );
            }

            const isContiene = currentItem.hint && currentItem.hint.toLowerCase().includes('contiene');

            return (
                <div className="relative">
                    {/* Error Feedback Modal */}
                    {feedback && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50 backdrop-blur-sm animate-in fade-in">
                            <div className="bg-white dark:bg-slate-900 rounded-3xl p-8 max-w-md w-full text-center shadow-2xl border-4 border-red-500 animate-in zoom-in-95">
                                <div className="text-6xl mb-4">❌</div>
                                <h3 className="text-2xl font-black text-red-500 mb-2">¡Incorrecto!</h3>
                                <p className="text-slate-500 font-bold mb-6">La respuesta correcta era:</p>
                                <div className="p-4 bg-slate-100 dark:bg-slate-800 rounded-xl mb-8">
                                    <p className="text-3xl font-black text-slate-800 dark:text-white uppercase tracking-widest">{feedback.word}</p>
                                </div>
                                <button onClick={handleFeedbackDismiss} className="w-full py-4 bg-red-500 hover:bg-red-600 text-white font-bold rounded-xl shadow-lg shadow-red-500/30 transition-all">Continuar</button>
                            </div>
                        </div>
                    )}

                    <div className="grid lg:grid-cols-2 gap-8 items-center max-w-6xl mx-auto mt-4 animate-in fade-in pb-10">
                        {/* RUEDA (ROSCO) */}
                        <div className="relative aspect-square w-full max-w-[500px] mx-auto select-none">
                            <div className="absolute inset-[10%] rounded-full border-[2px] border-slate-200 dark:border-slate-700 border-dashed animate-[spin_60s_linear_infinite] opacity-50"></div>
                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center w-32 h-32 bg-white dark:bg-slate-800 rounded-full shadow-2xl z-20 border-4 border-slate-100 dark:border-slate-700 transition-all">
                                <span className="text-5xl font-black text-indigo-600 dark:text-indigo-400">{currentItem.letter}</span>
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-widest mt-1">Turno</span>
                            </div>
                            {gameItems.map((item, idx) => {
                                const total = gameItems.length;
                                const angle = (idx / total) * 2 * Math.PI - Math.PI / 2; 
                                const radius = 42; 
                                const x = 50 + radius * Math.cos(angle);
                                const y = 50 + radius * Math.sin(angle);
                                
                                const status = answers[idx]; 
                                const isActive = idx === currentIdx;
                                
                                let baseClasses = "absolute w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center text-sm md:text-lg font-black transition-all duration-500 shadow-md border-2";
                                let statusClasses = "";
                                
                                if (isActive) {
                                    statusClasses = "bg-indigo-600 border-indigo-400 text-white scale-125 z-10 ring-4 ring-indigo-200 dark:ring-indigo-900 shadow-xl shadow-indigo-600/40";
                                } else if (status === 'CORRECT') {
                                    statusClasses = "bg-green-500 border-green-400 text-white";
                                } else if (status === 'WRONG') {
                                    statusClasses = "bg-red-500 border-red-400 text-white";
                                } else {
                                    statusClasses = "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-300 group-hover:scale-110";
                                }

                                return (
                                    <div 
                                        key={idx} 
                                        className={`${baseClasses} ${statusClasses}`} 
                                        style={{ left: `${x}%`, top: `${y}%`, transform: `translate(-50%, -50%) ${isActive ? 'scale(1.25)' : 'scale(1)'}` }}
                                    >
                                        {item.letter}
                                    </div>
                                );
                            })}
                        </div>
                        {/* CONTROLES Y DEFINICIÓN */}
                        <div className="flex flex-col justify-center space-y-6 lg:pl-10">
                            <div className="flex justify-between items-center bg-slate-100 dark:bg-slate-800/50 p-4 rounded-2xl border border-slate-200 dark:border-slate-700">
                                <div className="flex items-center gap-2">
                                    <span className="text-2xl">❤️</span>
                                    <div className="flex gap-1">
                                        {[...Array(5)].map((_, i) => (
                                            <div key={i} className={`w-3 h-3 rounded-full transition-all ${i < lives ? 'bg-red-500' : 'bg-slate-300 dark:bg-slate-700'}`} />
                                        ))}
                                    </div>
                                </div>
                                <div className="font-mono font-bold text-xl text-indigo-600 dark:text-indigo-400">
                                    PTS: {score}
                                </div>
                            </div>
                            <div className="bg-white dark:bg-slate-800 p-8 rounded-[2.5rem] shadow-2xl border border-slate-100 dark:border-slate-700 relative overflow-hidden transition-all">
                                <div className={`absolute top-0 left-0 w-full h-2 ${isContiene ? 'bg-amber-500' : 'bg-indigo-500'}`}></div>
                                <div className="flex items-center gap-3 mb-6">
                                    <span className={`px-3 py-1 rounded-lg text-xs font-black uppercase tracking-widest text-white ${isContiene ? 'bg-amber-500' : 'bg-indigo-500'}`}>
                                        {isContiene ? `Contiene la ${currentItem.letter}` : `Empieza por ${currentItem.letter}`}
                                    </span>
                                </div>
                                <p className="text-xl md:text-2xl font-medium leading-relaxed text-slate-600 dark:text-slate-300 mb-8 min-h-[100px]">
                                    {currentItem.definition}
                                </p>
                                <div className="space-y-4">
                                    <input 
                                        type="text" 
                                        value={userInput} 
                                        onChange={(e) => setUserInput(e.target.value)} 
                                        onKeyDown={(e) => e.key === 'Enter' && handleCheck()} 
                                        placeholder="Escribe tu respuesta..." 
                                        className="w-full p-5 rounded-2xl bg-slate-50 dark:bg-slate-900 border-2 border-slate-200 dark:border-slate-700 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none text-lg font-bold transition-all text-slate-900 dark:text-white placeholder:font-normal placeholder:text-slate-400" 
                                        autoFocus 
                                        autoComplete="off"
                                    />
                                    <div className="grid grid-cols-2 gap-4">
                                        <button 
                                            onClick={handleCheck} 
                                            className="py-4 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white rounded-2xl font-bold transition-all shadow-xl shadow-indigo-600/20 flex items-center justify-center gap-2"
                                        >
                                            <span>✓</span> Comprobar
                                        </button>
                                        <button 
                                            onClick={handlePasapalabra} 
                                            className="py-4 bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 active:scale-95 text-slate-600 dark:text-slate-200 rounded-2xl font-bold transition-all flex items-center justify-center gap-2"
                                        >
                                            <span>⏩</span> Pasapalabra
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const HangmanGame = ({ data, onBack, user, subject, topic }) => {
             const [itemIdx, setItemIdx] = useState(0);
            const [usedLetters, setUsedLetters] = useState([]);
            const [mistakes, setMistakes] = useState(0);
            const [status, setStatus] = useState('PLAYING');
            const [score, setScore] = useState(0);
            const [totalScore, setTotalScore] = useState(0); // Puntuación acumulada de todas las palabras
            const [globalStartTime] = useState(Date.now()); // Tiempo inicio de la sesión
            const [isSaving, setIsSaving] = useState(false);

            // Randomly select up to 10 words if more are available
            const gameItems = useMemo(() => {
                if(!data || data.length === 0) return [];
                // Clone and shuffle
                const shuffled = [...data].sort(() => 0.5 - Math.random());
                return shuffled.slice(0, 10);
            }, [data]);

            const currentItem = gameItems[itemIdx];
            const word = currentItem ? currentItem.word.toUpperCase() : '';

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const saveReport = async (finalTotalScore) => {
                const timeSpent = Math.floor((Date.now() - globalStartTime) / 1000);
                const timeFormatted = formatTime(timeSpent);
                setIsSaving(true);
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            type: 'report',
                            report: {
                                appId: getAppId(),
                                user: user,
                                subject: subject,
                                topic: topic,
                                game: 'ahorcado',
                                score: finalTotalScore,
                                time: `'${timeFormatted}`
                            }
                        })
                    });
                } catch (e) {
                    console.error("Error saving report", e);
                } finally {
                    setIsSaving(false);
                }
            };

            const handleLetter = (letter) => {
                if (usedLetters.includes(letter) || status !== 'PLAYING') return;
                
                const isCorrect = word.includes(letter);
                setUsedLetters(prev => [...prev, letter]);
                
                if (isCorrect) {
                    setScore(s => s + 50);
                } else {
                    setScore(s => s - 10);
                    setMistakes(m => m + 1);
                }
            };

            // Escuchar eventos de teclado físico
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (status !== 'PLAYING') return;
                    const key = e.key.toUpperCase();
                    const validChars = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";
                    if (validChars.includes(key)) {
                        handleLetter(key);
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [status, usedLetters, word]);

            useEffect(() => {
                if (mistakes >= 6) {
                    setStatus('LOST');
                } else if (word && word.split('').every(l => usedLetters.includes(l) || l === ' ')) {
                    setStatus('WON');
                }
            }, [usedLetters, mistakes, word]);

            const handleNextOrFinish = () => {
                if(isSaving) return; // Prevent double submission
                const newTotalScore = totalScore + score;
                
                if (itemIdx < gameItems.length - 1) { 
                    setTotalScore(newTotalScore);
                    setItemIdx(i => i + 1); 
                    setUsedLetters([]); 
                    setMistakes(0); 
                    setStatus('PLAYING'); 
                    setScore(0);
                } else {
                    // Send report only at the end
                    saveReport(newTotalScore);
                    // Wait a moment before going back
                    setTimeout(onBack, 2000); 
                }
            };

            if (!currentItem) return (
                <div className="flex flex-col items-center justify-center p-8 text-center">
                    <h2 className="text-3xl font-black mb-4 dark:text-white">¡Juego Terminado!</h2>
                    {isSaving && <p className="text-indigo-500 animate-pulse font-bold">Guardando puntuación total...</p>}
                    {!isSaving && <button onClick={onBack} className="mt-4 px-6 py-2 bg-slate-200 rounded-lg font-bold">Volver</button>}
                </div>
            );

            return (
                <div className="max-w-6xl mx-auto flex flex-col items-center gap-4 mt-4 animate-in fade-in relative">
                    {/* Score Header */}
                    <div className="absolute top-0 right-0 p-4 bg-white dark:bg-slate-800 rounded-xl shadow-lg border border-slate-200 dark:border-slate-700 z-10">
                        <p className="text-xs font-bold text-slate-500 uppercase tracking-wider">Acumulado</p>
                        <p className="text-2xl font-black text-indigo-600 dark:text-indigo-400">{totalScore + score}</p>
                    </div>

                    <div className="grid lg:grid-cols-2 gap-8 w-full items-center">
                        <div className="bg-white dark:bg-slate-800 p-4 rounded-3xl flex justify-center border-b-4 border-slate-200 dark:border-slate-700">
                             <svg width="150" height="200" viewBox="0 0 200 250" className="stroke-slate-900 dark:stroke-white fill-none stroke-[6]">
                                <line x1="20" y1="230" x2="180" y2="230" /><line x1="60" y1="230" x2="60" y2="20" /><line x1="60" y1="20" x2="140" y2="20" /><line x1="140" y1="20" x2="140" y2="50" />
                                {mistakes > 0 && <circle cx="140" cy="80" r="25" />}{mistakes > 1 && <line x1="140" y1="105" x2="140" y2="170" />}{mistakes > 2 && <line x1="140" y1="120" x2="110" y2="150" />}{mistakes > 3 && <line x1="140" y1="120" x2="170" y2="150" />}{mistakes > 4 && <line x1="140" y1="170" x2="110" y2="210" />}{mistakes > 5 && <line x1="140" y1="170" x2="170" y2="210" />}
                             </svg>
                        </div>
                        <div className="space-y-6 w-full overflow-hidden">
                            <div className="bg-yellow-500/10 border-2 border-yellow-500/20 p-4 rounded-2xl text-center"><h4 className="text-xs font-bold uppercase text-yellow-600 mb-1">Pista:</h4><p className="text-md font-medium italic leading-tight">"{currentItem.hint}"</p></div>
                            
                            {/* Word Container - Reducido para caber 20 caracteres */}
                            <div className="flex flex-wrap justify-center gap-1 p-2 w-full">
                                {word.split('').map((l, i) => (
                                    <div key={i} className={`flex-shrink-0 flex items-center justify-center font-black dark:text-white border-b-2 transition-all duration-300 ${
                                        l === ' ' ? 'w-2 border-transparent' : 
                                        'w-6 h-8 md:w-8 md:h-12 border-indigo-500 text-sm md:text-xl bg-white/50 dark:bg-slate-800/50 rounded-t-md'
                                    }`}>
                                        {usedLetters.includes(l) || status === 'LOST' ? l : ''}
                                    </div>
                                ))}
                            </div>

                            {status !== 'PLAYING' && (
                                <div className={`p-4 rounded-2xl text-center animate-bounce ${status === 'WON' ? 'bg-green-500 text-white' : 'bg-red-500 text-white'}`}>
                                    <h3 className="text-lg font-black mb-1">{status === 'WON' ? '¡Palabra Completada!' : 'Fin de la Partida'}</h3>
                                    {isSaving && <p className="text-xs opacity-80 mb-2 animate-pulse">Guardando resultados...</p>}
                                    <button onClick={handleNextOrFinish} className="px-6 py-2 bg-white text-slate-900 rounded-lg font-bold shadow-lg hover:scale-105 transition-transform">
                                        {itemIdx < gameItems.length - 1 ? "Siguiente Palabra" : "Finalizar y Guardar"}
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                    <div className="grid grid-cols-7 sm:grid-cols-9 gap-1 w-full max-w-2xl px-2">
                        {"ABCDEFGHIJKLMNÑOPQRSTUVWXYZ".split('').map(l => (
                            <button 
                                key={l} 
                                disabled={usedLetters.includes(l) || status !== 'PLAYING'} 
                                onClick={() => handleLetter(l)} 
                                className={`p-2 rounded-md font-bold text-sm transition-all ${usedLetters.includes(l) ? 'opacity-20 grayscale scale-95' : 'bg-white dark:bg-slate-800 hover:bg-indigo-500 hover:text-white shadow text-slate-900 dark:text-white hover:-translate-y-1'}`}
                            >
                                {l}
                            </button>
                        ))}
                    </div>
                </div>
            );
        };
        
        const TrueFalseGame = ({ data, onBack, user, subject, topic }) => {
            const [currentIdx, setCurrentIdx] = useState(0); 
            const [score, setScore] = useState(0); 
            const [showResult, setShowResult] = useState(false); 
            const [userAnswer, setUserAnswer] = useState(null); 
            const [isConfirmed, setIsConfirmed] = useState(false); 
            const [startTime] = useState(Date.now());
            const [isSaving, setIsSaving] = useState(false);
            
            // Randomly select up to 10 questions if more are available
            const gameItems = useMemo(() => {
                if(!data || data.length === 0) return [];
                const shuffled = [...data].sort(() => 0.5 - Math.random());
                return shuffled.slice(0, 10);
            }, [data]);

            const current = gameItems[currentIdx];

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const saveReport = async (finalScore) => {
                const timeSpent = Math.floor((Date.now() - startTime) / 1000);
                const timeFormatted = formatTime(timeSpent);
                setIsSaving(true);
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            type: 'report',
                            report: {
                                appId: getAppId(),
                                user: user,
                                subject: subject,
                                topic: topic,
                                game: 'verdadero',
                                score: finalScore,
                                time: `'${timeFormatted}`
                            }
                        })
                    });
                } catch (e) {
                    console.error(e);
                } finally {
                    setIsSaving(false);
                }
            };

            const handleAnswer = (val) => { 
                if(!isConfirmed) setUserAnswer(val); 
            }; 
            
            const handleConfirm = () => { 
                if(userAnswer === null) return; 
                setIsConfirmed(true); 
                if(userAnswer === current.isTrue) {
                    setScore(s => s + 50);
                } else {
                    setScore(s => s - 10);
                }
            }; 
            
            const next = () => { 
                if(currentIdx < gameItems.length - 1) { 
                    setCurrentIdx(c => c+1); 
                    setUserAnswer(null); 
                    setIsConfirmed(false); 
                } else { 
                    setShowResult(true); 
                } 
            };

            useEffect(() => {
                if(showResult) {
                    saveReport(score);
                }
            }, [showResult]);

            if(!current && !showResult) return <div className="p-10 text-center text-slate-500 font-bold">Cargando preguntas...</div>;

            if(showResult) return (
                <div className="max-w-md mx-auto text-center p-12 bg-white dark:bg-slate-800 rounded-[3rem] shadow-2xl mt-10 animate-in zoom-in">
                    <h2 className="text-3xl font-black mb-4 dark:text-white">Resultado Final</h2>
                    <div className="mb-6">
                        <p className="text-sm text-slate-500 uppercase tracking-wider font-bold">Puntuación Total</p>
                        <p className="text-5xl font-black text-indigo-600 dark:text-indigo-400">{score}</p>
                    </div>

        };
        const MemoryGame = ({ data, onBack, user, subject, topic }) => {
            const [cards, setCards] = useState([]);
            const [flipped, setFlipped] = useState([]);
            const [matched, setMatched] = useState([]);
            const [score, setScore] = useState(0);
            const [startTime, setStartTime] = useState(Date.now());
            const [isSaving, setIsSaving] = useState(false);
            const [finished, setFinished] = useState(false);

            useEffect(() => {
                // Select only 6 pairs randomly
                const subset = [...data].sort(() => 0.5 - Math.random()).slice(0, 6);
                const d = [];
                subset.forEach((item, i) => {
                    d.push({ id: `t-${i}`, content: item.term, type: 'term', pairId: i });
                    d.push({ id: `d-${i}`, content: item.definition, type: 'def', pairId: i });
                });
                setCards(d.sort(() => Math.random() - 0.5));
            }, [data]);

            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            const saveReport = async (finalScore) => {
                const timeSpent = Math.floor((Date.now() - startTime) / 1000);
                const timeFormatted = formatTime(timeSpent);
                setIsSaving(true);
                try {
                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            type: 'report',
                            report: {
                                appId: getAppId(),
                                user: user,
                                subject: subject,
                                topic: topic,
                                game: 'pareja',
                                score: finalScore,
                                time: `'${timeFormatted}`
                            }
                        })
                    });
                } catch (e) {
                    console.error("Error saving report", e);
                } finally {
                    setIsSaving(false);
                }
            };

            useEffect(() => {
                if (finished) {
                    saveReport(score);
                }
            }, [finished]);

            const handleCardClick = (id) => {
                if (flipped.length === 2 || matched.includes(id) || flipped.includes(id)) return;
                
                const newFlipped = [...flipped, id];
                setFlipped(newFlipped);
                
                if (newFlipped.length === 2) {
                    const c1 = cards.find(c => c.id === newFlipped[0]);
                    const c2 = cards.find(c => c.id === newFlipped[1]);
                    
                    if (c1.pairId === c2.pairId && c1.type !== c2.type) {
                        setMatched(prev => [...prev, c1.id, c2.id]);
                        setFlipped([]);
                        setScore(s => s + 50);
                    } else {
                        setScore(s => s - 10);
                        setTimeout(() => setFlipped([]), 1000);
                    }
                }
            };

            useEffect(() => {
                if (cards.length > 0 && matched.length === cards.length) {
                    setFinished(true);
                }
            }, [matched, cards]);

            if (finished) {
                return (
                    <div className="max-w-md mx-auto text-center p-12 bg-white dark:bg-slate-800 rounded-[3rem] shadow-2xl mt-10 animate-in zoom-in">
                        <h2 className="text-3xl font-black mb-4 dark:text-white">¡Memoria Completada!</h2>
                        <div className="mb-6">
                            <p className="text-sm text-slate-500 uppercase tracking-wider font-bold">Puntuación Final</p>
                            <p className="text-5xl font-black text-indigo-600 dark:text-indigo-400">{score}</p>
                        </div>
                        {isSaving && <div className="text-xs text-indigo-500 animate-pulse mb-6">Guardando resultado...</div>}
                        <button onClick={onBack} className="px-8 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-colors">Volver</button>
                    </div>
                );
            }

            return (
                <div className="max-w-5xl mx-auto mt-8 animate-in fade-in">
                    <div className="flex justify-between items-center mb-6 bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm">
                        <h3 className="font-bold text-slate-700 dark:text-slate-200">Encuentra las parejas</h3>
                        <div className="font-mono text-xl font-black text-indigo-600 dark:text-indigo-400">PTS: {score}</div>
                    </div>
                    <div className="grid grid-cols-3 md:grid-cols-4 gap-4">
                        {cards.map(card => {
                            const isFlipped = flipped.includes(card.id) || matched.includes(card.id);
                            return (
                                <div key={card.id} onClick={() => handleCardClick(card.id)} className={`aspect-[4/3] cursor-pointer perspective-1000`}>
                                    <div className={`relative w-full h-full duration-500 transform-style-preserve-3d transition-transform ${isFlipped ? 'rotate-y-180' : ''}`}>
                                        <div className="absolute inset-0 backface-hidden bg-indigo-600 rounded-xl flex items-center justify-center text-white text-3xl font-bold shadow-lg border-2 border-indigo-400">
                                            ?
                                        </div>
                                        <div className={`absolute inset-0 backface-hidden rotate-y-180 bg-white dark:bg-slate-800 rounded-xl flex items-center justify-center p-4 text-center text-sm font-bold shadow-lg border-2 ${matched.includes(card.id) ? 'border-green-500 text-green-600 dark:text-green-400' : 'border-indigo-100 dark:border-slate-600 text-slate-800 dark:text-white'}`}>
                                            {card.content}
                                        </div>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const Login = ({ onLogin }) => {

                                >

                                <input

                                    onKeyDown={e => e.key === 'Enter' && !loading && handleEnter()}
                                    autoFocus

                                        onChange={e => setPass(e.target.value)}

                                        onClick={() => setSelectedSubject(subject)}
                                        className="bg-white dark:bg-slate-900 p-6 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg text-left hover:border-indigo-400/50 hover:shadow-2xl hover:-translate-y-0.5 transition-all"
                                    >
                                        <div className="font-black text-xl text-slate-800 dark:text-white flex items-center gap-2">
                                            <span className="text-indigo-500">📚</span> {subject}
                                        </div>
                                        <p className="text-sm text-slate-500 mt-2">Ver situaciones de aprendizaje</p>
                                    </button>
                                ))}
                            </div>
                        )}

                        {(!hasMultipleSubjects || selectedSubject) && (
                            <div className="bg-white dark:bg-slate-900 p-6 rounded-[2rem] border border-slate-200 dark:border-slate-800 shadow-lg">
                                <div className="flex items-center justify-between mb-4">
                                    <h3 className="font-black text-xl text-slate-800 dark:text-white flex items-center gap-2">
                                        <span className="text-indigo-500">📚</span> {activeSubject}
                                    </h3>
                                    {hasMultipleSubjects && (
                                        <button
                                            onClick={() => setSelectedSubject(null)}
                                            className="text-xs font-bold uppercase tracking-widest text-slate-400 hover:text-indigo-500 transition-colors"
                                        >
                                            Cambiar asignatura
                                        </button>
                                    )}
                                </div>
                                <div className="space-y-2">
                                    {topics.map(topic => (
                                        <button
                                            key={topic}
                                            onClick={() => onSelectTopic({ subject: activeSubject, topic })}
                                            className="w-full text-left p-4 rounded-xl bg-slate-50 dark:bg-slate-800 hover:bg-indigo-50 dark:hover:bg-indigo-900/20 border border-slate-100 dark:border-slate-700 hover:border-indigo-200 dark:hover:border-indigo-800 transition-all flex items-center justify-between group"
                                        >
                                            <span className="font-medium text-slate-700 dark:text-slate-300 group-hover:text-indigo-600 dark:group-hover:text-indigo-400">{topic}</span>
                                            <span className="text-slate-300 group-hover:translate-x-1 transition-transform">→</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('LOADING'); 
            const [gameData, setGameData] = useState(null);
            const [user, setUser] = useState(null);
            const [userAvatar, setUserAvatar] = useState(null);
            const [isAdmin, setIsAdmin] = useState(false);
            const [theme, setTheme] = useState('dark');
            const [appId, setAppId] = useState('default');
            const [activeConfig, setActiveConfig] = useState({ disabledCats: [], disabledSits: [] });
            
            // Estado para el filtro del jugador (selección de tema)
            const [playerFilter, setPlayerFilter] = useState(null); // { subject: "...", topic: "..." } o null (Todos)

            useLayoutEffect(() => {
                const isDark = theme === 'dark';
                document.documentElement.classList.toggle('dark', isDark);
            }, [theme]);

            // Helper to fetch data
            const loadGameData = async () => {
                try {
                    // Add timestamp to prevent caching
                    const response = await fetch(`./datos.csv?_t=${Date.now()}`);
                    if (!response.ok) throw new Error('No data file');
                    const text = await response.text();
                    return parseCSV(text);
                } catch (err) {
                    console.log("Auto-load failed", err);
                    return null;
                }
            };

            useEffect(() => {
                const currentAppId = getAppId();
                setAppId(currentAppId);

                // Load Config
                const localConfigStr = localStorage.getItem('edupanel_multitenant_config');
                if (localConfigStr) {
                    try {
                        const localConfig = JSON.parse(localConfigStr);
                        if (localConfig[currentAppId]) {
                            setActiveConfig(localConfig[currentAppId]);
                        }
                    } catch(e) { console.error(e); }
                }

                fetch(`${GOOGLE_SCRIPT_URL}?type=config&_t=${Date.now()}`)
                    .then(res => res.json())
                    .then(data => {
                        if (data && !data.error) {
                            localStorage.setItem('edupanel_multitenant_config', JSON.stringify(data));
                            if (data[currentAppId]) {
                                setActiveConfig(data[currentAppId]);
                            }
                        }
                    })
                    .catch(err => console.log("Config load failed or offline", err));

                // Load Initial Data
                (async () => {
                    const data = await loadGameData();
                    setGameData(data);
                    setView('LOGIN');
                })();
            }, []);

            // 1. Filtrado de Admin: Elimina lo desactivado por el profesor.
            const adminFilteredData = useMemo(() => {
                if (!gameData) return null;
                const filterItems = (items) => {
                    if (!items) return [];
                    return items.filter(item => {
                        // Si la asignatura está desactivada, eliminamos TODO.
                        const isCatDisabled = activeConfig.disabledCats?.includes(item.subject);
                        if (isCatDisabled) return false;
                        
                        // Si el tema está desactivado, eliminamos.
                        const isSitDisabled = activeConfig.disabledSits?.includes(item.topic);
                        return !isSitDisabled;
                    });
                };

                return {
                    ...gameData,
                    rosco: filterItems(gameData.rosco),
                    hangman: filterItems(gameData.hangman),
                    trueFalse: filterItems(gameData.trueFalse),
                    memory: filterItems(gameData.memory),
                    sopa: filterItems(gameData.sopa),
                    clasificador: filterItems(gameData.clasificador)
                };
            }, [gameData, activeConfig]);

            // 2. Filtrado de Sesión (Jugador): Aplica la elección del alumno sobre los datos ya filtrados por admin.
            const sessionGameData = useMemo(() => {
                if (!adminFilteredData) return null;
                
                // Si es admin, mostramos todo sin filtrar por elección
                if (isAdmin) return gameData; 

                // Si no hay filtro de jugador, mostramos todo lo permitido por admin
                if (!playerFilter) {
                    const newData = { ...adminFilteredData };
                    
                    // Detectar si solo hay un tema/asignatura disponible para mostrar el título correcto
                    const subjects = new Set();
                    const topics = new Set();
                    
                    const collect = (arr) => {
                        if (!arr) return;
                        arr.forEach(item => {
                            if (item.subject) subjects.add(item.subject);
                            if (item.topic) topics.add(item.topic);
                        });
                    };

                    collect(newData.rosco);
                    collect(newData.hangman);
                    collect(newData.trueFalse);
                    collect(newData.memory);
                    collect(newData.sopa);
                    collect(newData.clasificador);

                    if (subjects.size === 1 && topics.size === 1) {
                        newData.subject = Array.from(subjects)[0];
                        newData.topic = Array.from(topics)[0];
                    } else {
                        // Ajuste cosmético de títulos
                        newData.subject = "Repaso General";
                        newData.topic = "Varios Temas";
                    }
                    return newData;
                }

                // Filtrar por selección específica del jugador
                const filterBySelection = (items) => {
                    if (!items) return [];
                    return items.filter(item => 
                        item.subject === playerFilter.subject && item.topic === playerFilter.topic
                    );
                };

                return {
                    ...adminFilteredData,
                    subject: playerFilter.subject,
                    topic: playerFilter.topic,
                    rosco: filterBySelection(adminFilteredData.rosco),
                    hangman: filterBySelection(adminFilteredData.hangman),
                    trueFalse: filterBySelection(adminFilteredData.trueFalse),
                    memory: filterBySelection(adminFilteredData.memory),
                    sopa: filterBySelection(adminFilteredData.sopa),
                    clasificador: filterBySelection(adminFilteredData.clasificador)
                };
            }, [adminFilteredData, playerFilter, isAdmin, gameData]);

            const toggleTheme = () => setTheme(prev => prev === 'light' ? 'dark' : 'light');
            
            const handleUpload = (data) => {
                setGameData(data);
            };
            
            const handleLogin = async (username, adminStatus, avatar) => {
                // Si es admin, recargamos los datos del CSV para asegurar que tenga la última versión
                if (adminStatus) {
                    const refreshedData = await loadGameData();
                    if (refreshedData) {
                        setGameData(refreshedData);
                    }
                }

                setUser(username);
                setIsAdmin(adminStatus);
                setUserAvatar(avatar);
                if (adminStatus) {
                    setView('ADMIN');
                } else {
                    // Lógica para determinar si vamos a Selección de Tema o directo a Home
                    if (adminFilteredData) {
                        const structure = buildStructure(adminFilteredData);
                        const subjects = Object.keys(structure);
                        const hasMultipleSubjects = subjects.length > 1;
                        const hasMultipleTopicsInSingleSubject = subjects.length === 1 && (structure[subjects[0]] || []).length > 1;

                        if (hasMultipleSubjects || hasMultipleTopicsInSingleSubject) {
                            setView('TOPIC_SELECTION');
                        } else {
                            // Solo hay una asignatura y una situación (o ninguna), vamos directo
                            setPlayerFilter(null); 
                            setView('HOME');
                        }
                    } else {
                        // Si no hay datos cargados aún, vamos a Home (allí saldrá el uploader)
                        setView('HOME');
                    }
                }
            };

            const handleLogout = () => {
                setUser(null);
                setUserAvatar(null);
                setIsAdmin(false);
                setPlayerFilter(null);
                setView('LOGIN');
            };
            
            const handleTopicSelection = (selection) => {
                setPlayerFilter(selection);
                setView('HOME');
            };
            
            const downloadSample = () => {
                const blob = new Blob([SAMPLE_CSV], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'plantilla_juegos.csv';
                a.click();
            };

            const renderContent = () => {
                switch(view) {
                    case 'LOADING': return <div className="flex h-screen items-center justify-center text-indigo-500 animate-pulse font-bold text-xl">Cargando recursos...</div>;
                    case 'LOGIN': return <Login onLogin={handleLogin} />;
                    case 'ADMIN': return <AdminDashboard data={gameData} appId={appId} onLogout={handleLogout} />;
                    case 'TOPIC_SELECTION': return <TopicSelection data={adminFilteredData} onSelectTopic={handleTopicSelection} user={user} />;
                    case 'ROSCO': return <RoscoGame data={sessionGameData?.rosco || []} onBack={() => setView('HOME')} user={user} subject={sessionGameData?.subject} topic={sessionGameData?.topic} />;
                    case 'HANGMAN': return <HangmanGame data={sessionGameData?.hangman || []} onBack={() => setView('HOME')} user={user} subject={sessionGameData?.subject} topic={sessionGameData?.topic} />;
                    case 'TRUE_FALSE': return <TrueFalseGame data={sessionGameData?.trueFalse || []} onBack={() => setView('HOME')} user={user} subject={sessionGameData?.subject} topic={sessionGameData?.topic} />;
                    case 'MEMORY': return <MemoryGame data={sessionGameData?.memory || []} onBack={() => setView('HOME')} user={user} subject={sessionGameData?.subject} topic={sessionGameData?.topic} />;
                    default: 
                        // Verificación mejorada: Si todos los arrays están vacíos
                        const isEmpty = !isAdmin && sessionGameData && 
                            (!sessionGameData.rosco?.length && !sessionGameData.hangman?.length && !sessionGameData.trueFalse?.length && !sessionGameData.memory?.length);

                        if (isEmpty && gameData) {
                            return (
                                <div className="flex flex-col items-center justify-center min-h-[60vh] text-center space-y-4 animate-in fade-in zoom-in">
                                    <div className="text-8xl mb-4">🔒</div>
                                    <h2 className="text-3xl font-black text-slate-800 dark:text-white tracking-tight">Contenido no disponible</h2>
                                    <p className="text-lg text-slate-500 max-w-md mx-auto">Tu profesor ha desactivado estas actividades temporalmente o no hay juegos disponibles para el tema seleccionado.</p>
                                    <div className="flex gap-4 mt-8">
                                        <button onClick={() => setView('TOPIC_SELECTION')} className="px-6 py-3 bg-indigo-600 text-white hover:bg-indigo-700 rounded-xl font-bold transition-all">Cambiar Tema</button>
                                        <button onClick={handleLogout} className="px-6 py-3 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 rounded-xl font-bold transition-all">Salir</button>
                                    </div>
                                </div>
                            );
                        }
                        return <Home gameData={sessionGameData} onUpload={handleUpload} onSelectGame={setView} onDownloadSample={downloadSample} user={user} />;
                }
            };

            return (
                <div className="flex flex-col min-h-screen">
                    {view !== 'ADMIN' && view !== 'LOADING' && view !== 'LOGIN' && (
                        <Navbar 
                            theme={theme} 
                            onToggleTheme={toggleTheme} 
                            currentView={view} 
                            onGoHome={() => {
                                if(isAdmin) setView('ADMIN');
                                else if (view === 'HOME') setView('TOPIC_SELECTION'); // Back from Home goes to Topic Select
                                else setView('HOME');
                            }} 
                            onLogin={() => isAdmin ? setView('ADMIN') : alert('Acceso restringido a Administrador')} 
                            onLogout={handleLogout}
                            user={user} 
                            userAvatar={userAvatar}
                            // Usamos sessionGameData para el Navbar
                            gameData={isAdmin ? gameData : sessionGameData}
                            isAdmin={isAdmin}
                        />
                    )}
                    <main className={view === 'LOGIN' ? "flex-grow" : "flex-grow container mx-auto px-4 py-8"}>
                        {renderContent()}
                    </main>
                </div>
            );
        };

        try {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        } catch(e) {
            console.error("Error iniciando React:", e);
            document.body.innerHTML = '<div style="padding:20px; text-align:center; color:red"><h1>Error Fatal</h1><p>No se pudo iniciar la aplicación.</p></div>';
        }
    </script>
</body>
</html>
