<head>
    <meta charset="UTF-8">

    <title>EduPanel - Secundaria & Bachillerato</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    
    <!-- Tailwind CSS (Local) -->
    <script src="./libs/tailwind/tailwind.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        glass: "rgba(255, 255, 255, 0.1)",
                    },
                    animation: {
                        'bounce-short': 'bounce-short 1s ease-in-out infinite',
                        'blob': 'blob 7s infinite',
                        'fade-in': 'fadeIn 0.5s ease-out forwards',
                        'slide-down': 'slideDown 0.2s ease-out forwards',
                    },
                    keyframes: {
                        'bounce-short': {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        },
                        slideDown: {
                            '0%': { opacity: '0', transform: 'translateY(-10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>

        .rotate-y-180 { transform: rotateY(180deg); }
        .transform-style-preserve-3d { transform-style: preserve-3d; }

        /* Login Background Animation */
        .bg-grid-pattern {
            background-image: linear-gradient(to right, rgba(99, 102, 241, 0.1) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(99, 102, 241, 0.1) 1px, transparent 1px);

    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white transition-colors duration-300 min-h-screen selection:bg-indigo-500 selection:text-white overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useLayoutEffect } = React;

        // --- CONFIGURACIÓN API ---
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsZVnrJ4BNILsDHS8tZUMnpxDRCir5KoxTsUlbSDmaJWzYLrpuJ3QEkWVUqDTIqP_k/exec";

        // --- MULTI-TENANCY HELPER ---
        const getAppId = () => {
            const params = new URLSearchParams(window.location.search);
            return params.get('id') || 'default';
        };

        // --- AVATARES ---
        const AVATARS = [
            "🐶", "🐱", "🐭", "🐹", "🐰", "🦊", "🐻", "🐼", "🐨", "🐯",
            "🦁", "🐮", "🐷", "🐸", "🐵", "🐔", "🐧", "🐦", "🦆", "🦅",
            "🦉", "🦇", "🐺", "🐗", "🐴", "🦄", "🐝", "🐞", "🦋", "🐌"
        ];

        // --- GLOBAL HELPERS ---
        
        const parseCSV = (text) => {
            const cleanText = text.replace(/^\uFEFF/, '');
            const lines = cleanText.split(/\r?\n/);
            // Eliminados arrays de sopa y clasificador
            const rosco = [], hangman = [], trueFalse = [], memory = [];
            let subject = "General", topic = "Varios";

            // Buscar la primera línea de datos válida para extraer Asignatura y Tema
            const firstDataLine = lines.find(l => l.trim() && !l.trim().startsWith('#') && l.includes(';'));
            if(firstDataLine) {
                const parts = firstDataLine.split(';');
                if(parts.length >= 2) {
                    subject = parts[0].trim();
                    topic = parts[1].trim();
                }
            }

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line || line.startsWith('#') || line.startsWith('Asignatura;')) continue;
                
                const cols = line.split(';').map(c => c.trim());
                const type = cols[2]?.toLowerCase();
                
                if (type === 'rosco') {
                    const hint = cols[3]; // 'empieza' or 'contiene'
                    const def = cols[5];
                    const word = cols[6];
                    const letter = cols[4];
                    if(def && word && letter) {
                         rosco.push({ letter: letter.toUpperCase(), definition: def, word: word, hint: hint });
                    }
                } else if (type === 'ahorcado') {
                     hangman.push({ hint: cols[3], word: cols[4] });
                } else if (type === 'pareja') {
                     for(let k=4; k<cols.length; k+=2) {
                         if(cols[k] && cols[k+1]) memory.push({ term: cols[k], definition: cols[k+1] });
                     }
                } else if (type === 'verdadero') {
                     trueFalse.push({ statement: cols[4], isTrue: cols[5].toUpperCase() === 'VERDADERO', explanation: cols[6] });
                }
            }
            return { subject, topic, rosco, hangman, trueFalse, memory };
        };

        const SAMPLE_CSV = `Asignatura;Tema;Tipo;Pregunta;R1;R2;R3;R4;Tiempo;Correcta;URL Imagen
Tecnología y Digitalización 2º;La Madera;rosco;empieza;A;Madera fabricada con virutas prensadas con cola;aglomerado
Tecnología y Digitalización 2º;La Madera;rosco;empieza;B;Herramienta manual que taladra agujeros pequeños;barrena
Tecnología y Digitalización 2º;La Madera;ahorcado;Madera formada por chapas finas pegadas;CONTRACHAPADO
Tecnología y Digitalización 2º;La Madera;ahorcado;Herramienta para eliminar mucha madera rapido;ESCOFINA
Tecnología y Digitalización 2º;La Madera;ahorcado;Proceso que garantiza que la madera sea renovable;REFORESTACION
Tecnología y Digitalización 2º;La Madera;pareja;Maderas y clasificacion;PINO;BLANDA;ROBLE;DURA;CAOBA;TROPICAL
Tecnología y Digitalización 2º;La Madera;verdadero;Maderas;El pino es un ejemplo de madera dura;FALSO;El pino es una madera blanda de crecimiento rapido`;

        // ... (COMPONENTS: Toggle, ReportsTab, AdminDashboard, Navbar - se mantienen igual) ...
        const Toggle = ({ label, checked, onChange }) => (
            <label className="flex items-center justify-between p-3 bg-white dark:bg-slate-800 rounded-xl cursor-pointer shadow-sm hover:shadow-md transition-all border border-slate-100 dark:border-slate-700">
                <span className="font-medium text-sm text-slate-700 dark:text-slate-200">{label}</span>
                <div className="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" className="sr-only peer" checked={checked} onChange={onChange} />
                    <div className="w-11 h-6 bg-slate-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-indigo-300 dark:peer-focus:ring-indigo-800 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-indigo-600"></div>
                </div>
            </label>
        );

        const ReportsTab = ({ reports, loading, error, onRefresh }) => {
            const [filterSubject, setFilterSubject] = useState('Todas');
            const [filterTopic, setFilterTopic] = useState('Todos');
            const [filterUser, setFilterUser] = useState('');
            const [filterAppId, setFilterAppId] = useState('');

            // Helper to get value case-insensitively from object
            const getValue = (obj, keys) => {
                if (!obj) return undefined;
                const objKeys = Object.keys(obj);
                for (let key of keys) {
                    if (obj[key] !== undefined) return obj[key]; // Exact match
                    const found = objKeys.find(k => k.toLowerCase().trim() === key.toLowerCase()); // Fuzzy match
                    if (found) return obj[found];
                }
                return undefined;
            };

            const safeString = (val) => String(val || '').trim();

            const subjects = useMemo(() => {
                if (!Array.isArray(reports)) return ['Todas'];
                const s = new Set(
                    reports
                        .filter(r => r) // remove nulls
                        .map(r => safeString(getValue(r, ['subject', 'asignatura']) || 'General'))
                        .filter(Boolean)
                );
                return ['Todas', ...Array.from(s).sort()];
            }, [reports]);

            const topics = useMemo(() => {
                if (!Array.isArray(reports)) return ['Todos'];
                const t = new Set(
                    reports
                        .filter(r => r)
                        .map(r => safeString(getValue(r, ['topic', 'situacion', 'tema']) || 'General'))
                        .filter(Boolean)
                );
                return ['Todos', ...Array.from(t).sort()];
            }, [reports]);

            const filteredReports = useMemo(() => {
                if (!Array.isArray(reports)) return [];
                return reports.filter(r => {
                    if (!r) return false;
                    
                    const rSubject = safeString(getValue(r, ['subject', 'asignatura']) || 'General');
                    const rTopic = safeString(getValue(r, ['topic', 'situacion', 'tema']) || 'General');
                    const rUser = safeString(getValue(r, ['user', 'alumno', 'usuario', 'nombre']));
                    const rAppId = safeString(getValue(r, ['appId', 'id_app', 'id', 'app_id']));
                    
                    const matchSubject = filterSubject === 'Todas' || rSubject === filterSubject;
                    const matchTopic = filterTopic === 'Todos' || rTopic === filterTopic;
                    const matchUser = filterUser === '' || rUser.toLowerCase().includes(filterUser.toLowerCase());
                    const matchAppId = filterAppId === '' || rAppId.toLowerCase().includes(filterAppId.toLowerCase());
                    
                    return matchSubject && matchTopic && matchUser && matchAppId;
                });
            }, [reports, filterSubject, filterTopic, filterUser, filterAppId]);

            if (loading) return (
                <div className="flex flex-col items-center justify-center p-12 text-indigo-500 animate-pulse">
                    <span className="text-4xl mb-2">📊</span>
                    <p className="font-bold">Cargando datos de Google Sheets...</p>
                </div>
            );
            
            if (error) return (
                <div className="p-8 text-center text-red-500 bg-red-50 dark:bg-red-900/20 rounded-2xl border border-red-200 dark:border-red-800">
                    <p className="font-bold mb-2">Error al cargar reportes</p>
                    <p className="text-sm">{error}</p>
                    <button onClick={onRefresh} className="mt-4 px-4 py-2 bg-red-100 dark:bg-red-800 text-red-700 dark:text-red-100 rounded-lg text-sm font-bold">Reintentar</button>
                </div>
            );

            return (
                <div className="space-y-6 animate-in fade-in slide-in-from-bottom-4 duration-500">
                     <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-700">
                        <div>
                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">ID App</label>
                            <input 
                                type="text" 
                                value={filterAppId} 
                                onChange={e => setFilterAppId(e.target.value)} 
                                placeholder="Filtrar por ID..."
                                className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-indigo-500 outline-none transition-all placeholder:text-slate-400"
                            />
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Alumno</label>
                            <input 
                                type="text" 
                                value={filterUser} 
                                onChange={e => setFilterUser(e.target.value)} 
                                placeholder="Buscar nombre..."
                                className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-indigo-500 outline-none transition-all placeholder:text-slate-400"
                            />
                        </div>
                        <div>
                            <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Asignatura</label>
                            <select value={filterSubject} onChange={e => setFilterSubject(e.target.value)} className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                                {subjects.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                        </div>
                        <div className="flex gap-2">
                            <div className="flex-1">
                                <label className="block text-xs font-bold text-slate-500 uppercase mb-1">Tema</label>
                                <select value={filterTopic} onChange={e => setFilterTopic(e.target.value)} className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                                    {topics.map(t => <option key={t} value={t}>{t}</option>)}
                                </select>
                            </div>
                            <div className="flex items-end">
                                <button onClick={onRefresh} className="p-2.5 bg-indigo-100 hover:bg-indigo-200 dark:bg-indigo-900/40 dark:hover:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 rounded-xl font-bold transition-colors"><span>🔄</span></button>
                            </div>
                        </div>
                     </div>
                     
                     <div className="overflow-hidden rounded-2xl border border-slate-200 dark:border-slate-700 shadow-xl bg-white dark:bg-slate-900 min-h-[200px]">
                        <div className="overflow-x-auto">
                            <table className="w-full text-left text-sm whitespace-nowrap">
                                <thead className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 uppercase font-black text-xs text-slate-500">
                                    <tr>
                                        <th className="p-4">Fecha</th>
                                        <th className="p-4">ID App</th>
                                        <th className="p-4">Usuario</th>
                                        <th className="p-4">Juego</th>
                                        <th className="p-4">Asignatura</th>
                                        <th className="p-4">Tema</th>
                                        <th className="p-4 text-right">Puntuación</th>
                                        <th className="p-4 text-right">Tiempo</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                                    {filteredReports.length === 0 ? (
                                        <tr>
                                            <td colSpan="8" className="p-8 text-center text-slate-400">
                                                {Array.isArray(reports) && reports.length > 0 ? "No hay coincidencias con los filtros seleccionados." : (
                                                    <div className="flex flex-col items-center gap-4">
                                                        <span>No hay registros disponibles.</span>
                                                        <div className="p-4 bg-yellow-50 dark:bg-yellow-900/20 border border-yellow-200 dark:border-yellow-700 rounded-xl max-w-lg text-left text-xs text-yellow-800 dark:text-yellow-200">
                                                            <strong>⚠️ ¿Tabla vacía pero tienes datos?</strong>
                                                            <p className="mt-1">Si acabas de actualizar el App Script, es posible que estés viendo una versión "cacheada" antigua de la URL.</p>
                                                            <p className="mt-2">1. Ve a Google Apps Script.</p>
                                                            <p>2. Pulsa <strong>Implementar > Gestionar implementaciones</strong>.</p>
                                                            <p>3. Pulsa el icono de lápiz (Editar) > Versión: <strong>Nueva versión</strong>.</p>
                                                            <p>4. Pulsa <strong>Implementar</strong>.</p>
                                                        </div>
                                                        <button onClick={onRefresh} className="px-4 py-2 bg-indigo-50 dark:bg-indigo-900/20 text-indigo-600 dark:text-indigo-300 rounded-lg text-sm font-bold hover:bg-indigo-100 transition-colors">Actualizar Tabla</button>
                                                    </div>
                                                )}
                                            </td>
                                        </tr>
                                    ) : (
                                        filteredReports.map((row, i) => (
                                            <tr key={i} className="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                                                <td className="p-4 text-slate-500">{(() => {
                                                    const dateVal = getValue(row, ['timestamp', 'fecha']);
                                                    if (!dateVal) return '-';
                                                    return new Date(dateVal).toLocaleString('es-ES', {
                                                        day: '2-digit',
                                                        month: '2-digit',
                                                        year: 'numeric',
                                                        hour: '2-digit',
                                                        minute: '2-digit'
                                                    });
                                                })()}</td>
                                                <td className="p-4 text-xs font-mono text-slate-400">{getValue(row, ['appId', 'id_app']) || '-'}</td>
                                                <td className="p-4 font-bold text-slate-700 dark:text-slate-200">{getValue(row, ['user', 'alumno']) || 'Anónimo'}</td>
                                                <td className="p-4">
                                                    <span className={`px-2 py-1 rounded-md text-xs font-bold uppercase tracking-wider ${
                                                        safeString(getValue(row, ['game', 'juego'])).includes('rosco') ? 'bg-pink-100 text-pink-700 dark:bg-pink-900/30 dark:text-pink-300' :
                                                        safeString(getValue(row, ['game', 'juego'])).includes('ahorcado') ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300' :
                                                        'bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300'
                                                    }`}>
                                                        {getValue(row, ['game', 'juego'])}
                                                    </span>
                                                </td>
                                                <td className="p-4 text-slate-600 dark:text-slate-400">{getValue(row, ['subject', 'asignatura'])}</td>
                                                <td className="p-4 text-slate-600 dark:text-slate-400">{getValue(row, ['topic', 'situacion'])}</td>
                                                <td className="p-4 text-right font-black text-indigo-600 dark:text-indigo-400 text-lg">{getValue(row, ['score', 'puntuacion']) || 0}</td>
                                                <td className="p-4 text-right font-mono text-slate-500">
                                                    {(() => {
                                                        const t = getValue(row, ['time', 'tiempo']);
                                                        if (!t) return '-';
                                                        let str = String(t).trim();
                                                        // Forcefully remove leading quote if present in display logic
                                                        if (str.startsWith("'")) {
                                                            str = str.substring(1);
                                                        }
                                                        
                                                        // Handle Google Sheets ISO date string "1899-12-30T..." if it still occurs
                                                        if (str.includes('T') && str.includes('Z')) {
                                                            try {
                                                                const date = new Date(str);
                                                                if (!isNaN(date.getTime())) {
                                                                    const h = date.getUTCHours().toString().padStart(2, '0');
                                                                    const m = date.getUTCMinutes().toString().padStart(2, '0');
                                                                    const s = date.getUTCSeconds().toString().padStart(2, '0');
                                                                    return `${h}:${m}:${s}`;
                                                                }
                                                            } catch(e) {}
                                                        }
                                                        if (str.includes(':')) return str;
                                                        // Format raw seconds
                                                        const sec = parseInt(t, 10);
                                                        if (isNaN(sec)) return '-';
                                                        const h = Math.floor(sec / 3600).toString().padStart(2, '0');
                                                        const m = Math.floor((sec % 3600) / 60).toString().padStart(2, '0');
                                                        const s = (sec % 60).toString().padStart(2, '0');
                                                        return `${h}:${m}:${s}`;
                                                    })()}
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                        <div className="p-3 bg-slate-50 dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 text-xs text-center text-slate-500">Mostrando {filteredReports.length} registros</div>
                     </div>
                </div>
            );
        };

        // ... (AdminDashboard, Navbar, RoscoGame - se mantienen igual) ...
        const AdminDashboard = ({ data, appId, onLogout }) => {
            const [globalConfig, setGlobalConfig] = useState({});
            const [activeTab, setActiveTab] = useState('config'); 
            const [reportsData, setReportsData] = useState(null);
            const [loadingReports, setLoadingReports] = useState(false);
            const [reportsError, setReportsError] = useState(null);
            const [showHelp, setShowHelp] = useState(false); 
            
            const [isSaving, setIsSaving] = useState(false);
            const [saveStatus, setSaveStatus] = useState(null);

            const currentConfig = useMemo(() => {
                return globalConfig[appId] || { disabledCats: [], disabledSits: [] };
            }, [globalConfig, appId]);

            const { uniqueCats, uniqueSits } = useMemo(() => {
                if (!data) return { uniqueCats: [], uniqueSits: [] };
                const cats = new Set();
                const sits = new Set();
                if(data.subject) cats.add(data.subject);
                if(data.topic) sits.add(data.topic);
                return { uniqueCats: [...cats].sort(), uniqueSits: [...sits].sort() };
            }, [data]);

            useEffect(() => {
                const saved = localStorage.getItem('edupanel_multitenant_config');
                if(saved) {
                    try {
                        setGlobalConfig(JSON.parse(saved));
                    } catch(e) {
                        console.error("Error parsing config", e);
                    }
                }
                fetchCloudConfig();
            }, []);

            const fetchCloudConfig = async () => {
                try {
                    const response = await fetch(`${GOOGLE_SCRIPT_URL}?type=config&_t=${Date.now()}`);
                    const json = await response.json();
                    if (json && !json.error && typeof json === 'object') {
                        setGlobalConfig(prev => ({...prev, ...json}));
                        localStorage.setItem('edupanel_multitenant_config', JSON.stringify(json));
                    }
                } catch (e) {
                    console.warn("Could not fetch cloud config, using local.", e);
                }
            };

            const updateLocalConfig = (newCurrentConfig) => {
                const newGlobal = {
                    ...globalConfig,
                    [appId]: newCurrentConfig
                };
                setGlobalConfig(newGlobal);
                localStorage.setItem('edupanel_multitenant_config', JSON.stringify(newGlobal));
                setSaveStatus(null);
            };

            const toggleCat = (cat) => {
                const prev = currentConfig.disabledCats || [];
                const next = prev.includes(cat) ? prev.filter(c => c !== cat) : [...prev, cat];
                updateLocalConfig({ ...currentConfig, disabledCats: next });
